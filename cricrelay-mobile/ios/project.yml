# XcodeGen spec — run `xcodegen generate` inside cricrelay-mobile/ios/
# GitHub Actions does this automatically; on a local Mac: brew install xcodegen && xcodegen generate

name: CricRelayLive

options:
  bundleIdPrefix: uk.co.cricrelay
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    # Pinned to 2.2.0: last version before kVTCompressionPropertyKey_VariableBitRate
    # was added (in 2.2.1). That symbol is absent from the iOS 18.5 SDK shipped with
    # Xcode 16.4 on the macos-15 runner, causing a compile error. 2.2.0 still has the
    # RTMPHaishinKit product (introduced in 2.1.0) and uses Combine-based notification
    # (no Notification.next() non-sendable Swift 6 issue introduced in 2.2.5).
    exactVersion: "2.2.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: false
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

targets:
  CricRelayLive:
    type: application
    platform: iOS
    productName: CricRelay Live

    sources:
      - path: CricRelay
      - path: Features
      - path: Streaming
        excludes:
          # These two files import Flutter and belong to the Flutter plugin target only
          - StreamRtmpPlugin.swift
          - CricrelayCameraPlatformView.swift

    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit

    info:
      path: CricRelay/Info.plist
      properties:
        CFBundleName: CricRelay Live
        CFBundleDisplayName: CricRelay Live
        CFBundleIdentifier: uk.co.cricrelay.stream
        CFBundleShortVersionString: "2.0.4"
        CFBundleVersion: "27"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Archivo-ExtraBold.ttf
          - DMSans-Medium.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "CricRelay needs the camera to broadcast live cricket with a scoreboard overlay."
        NSMicrophoneUsageDescription: "CricRelay needs the microphone to include live commentary audio in the stream."
        UIBackgroundModes:
          - audio

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.cricrelay.stream
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        Release:
          DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
          PROVISIONING_PROFILE_SPECIFIER: "$(PROVISIONING_PROFILE_SPECIFIER)"

schemes:
  CricRelayLive:
    build:
      targets:
        CricRelayLive: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
