# XcodeGen spec — run `xcodegen generate` inside cricrelay-mobile/ios/
# GitHub Actions does this automatically; on a local Mac: brew install xcodegen && xcodegen generate

name: CricRelayLive

options:
  bundleIdPrefix: uk.co.cricrelay
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: false
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

targets:
  CricRelayLive:
    type: application
    platform: iOS
    productName: CricRelay Live

    sources:
      - path: CricRelay
      - path: Features
      - path: Streaming
        excludes:
          # These two files import Flutter and belong to the Flutter plugin target only
          - StreamRtmpPlugin.swift
          - CricrelayCameraPlatformView.swift

    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit

    info:
      path: CricRelay/Info.plist
      properties:
        CFBundleName: CricRelay Live
        CFBundleDisplayName: CricRelay Live
        CFBundleIdentifier: uk.co.cricrelay.stream
        CFBundleShortVersionString: "2.0.3"
        CFBundleVersion: "26"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "CricRelay needs the camera to broadcast live cricket with a scoreboard overlay."
        NSMicrophoneUsageDescription: "CricRelay needs the microphone to include live commentary audio in the stream."
        NSBluetoothAlwaysUsageDescription: "CricRelay BLE relay receives scores from PCS hardware scoreboards via Bluetooth."
        UIBackgroundModes:
          - audio

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.cricrelay.stream
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        Release:
          DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
          PROVISIONING_PROFILE_SPECIFIER: "$(PROVISIONING_PROFILE_SPECIFIER)"

  CricRelayLiveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"

    sources:
      - path: Tests

    dependencies:
      - target: CricRelayLive

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.cricrelay.stream.tests
        SWIFT_VERSION: "5.9"

schemes:
  CricRelayLive:
    build:
      targets:
        CricRelayLive: all
        CricRelayLiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CricRelayLiveTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
