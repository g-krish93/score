# Gate: Dart analyze + Android Kotlin compile (same steps as release APK build).
# Fails fast before the long APK job or EC2 deploy when native code is broken.
name: Validate CricRelay Stream

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "cricrelay-stream/**"
      - ".github/workflows/**"

concurrency:
  group: validate-stream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Run full stream validation
        run: |
          sed -i 's/\r$//' cricrelay-stream/scripts/ci_validate.sh
          sed -i 's/\r$//' cricrelay-stream/android-custom/apply_android_overlay.sh
          chmod +x cricrelay-stream/scripts/ci_validate.sh
          bash cricrelay-stream/scripts/ci_validate.sh

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test
        run: python validate_smoke.py

      - name: Import app module
        run: python -c "from server.app import app; assert app is not None"
