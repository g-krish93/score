# Optional OCI deploy — manual only. Production uses deploy.yml (EC2).
name: Deploy to OCI Compute

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.OCI_COMPUTE_HOST }}
          username: opc
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: SMTP_PASSWORD
          script: |
            set -e
            cd /app
            git pull origin main
            if [ -f deploy/cricket.service ]; then
              sudo install -m 644 deploy/cricket.service /etc/systemd/system/cricket.service
              sudo systemctl daemon-reload
            fi
            sudo pip3 install --break-system-packages --ignore-installed -r requirements.txt
            if [ -f deploy/persist-auth-env.sh ]; then
              sudo bash deploy/persist-auth-env.sh
            fi
            if [ -f deploy/configure-smtp-env.sh ]; then
              if [ -n "${SMTP_PASSWORD:-}" ]; then
                sudo mkdir -p /app/secrets
                printf '%s' "$SMTP_PASSWORD" | sudo tee /app/secrets/smtp_password > /dev/null
                sudo chmod 600 /app/secrets/smtp_password
              fi
              sudo bash deploy/configure-smtp-env.sh
            fi
            sudo systemctl stop cricket || true
            sleep 2
            sudo systemctl start cricket
            sleep 4
            if ! sudo systemctl is-active --quiet cricket; then
              echo "=== journalctl -u cricket (last 120 lines) ==="
              sudo journalctl -u cricket -n 120 --no-pager || true
              exit 1
            fi
            sudo systemctl status cricket --no-pager
