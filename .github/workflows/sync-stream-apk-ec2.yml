# Manual: pull latest main on EC2 so static/cricrelay-stream.apk is current.
name: Sync Stream APK to EC2

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            EMERGENCY_URL="https://raw.githubusercontent.com/g-krish93/score/main/deploy/ec2-emergency-cleanup.sh"
            curl -sfSL "$EMERGENCY_URL" | sudo bash || true
            cd /app
            if ! git fetch origin main; then
              curl -sfSL "$EMERGENCY_URL" | sudo bash || true
              git fetch origin main
            fi
            git reset --hard origin/main
            test -f static/cricrelay-stream.apk
            ls -la static/cricrelay-stream.apk
            sha256sum static/cricrelay-stream.apk | head -1
