name: Validate CricRelay Mobile

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "cricrelay-mobile/**"
      - ".github/workflows/validate-cricrelay-mobile.yml"
      - ".github/workflows/build-cricrelay-mobile.yml"

concurrency:
  group: validate-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: KMP tests and Android compile
        working-directory: cricrelay-mobile
        run: |
          chmod +x gradlew
          ./gradlew :shared:check :app:assembleRelease --no-daemon

  ios-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document

      - name: Generate Xcode project
        working-directory: cricrelay-mobile/ios
        run: xcodegen generate

      - name: Run iOS unit tests
        working-directory: cricrelay-mobile/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project CricRelayLive.xcodeproj \
            -scheme CricRelayLive \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath /tmp/test-results.xcresult \
            2>&1 | xcpretty --color
          echo "iOS tests passed ✅"

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: python validate_smoke.py
