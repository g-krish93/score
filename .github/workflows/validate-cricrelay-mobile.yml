name: Validate CricRelay Mobile

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "cricrelay-mobile/**"
      - ".github/workflows/validate-cricrelay-mobile.yml"
      - ".github/workflows/build-cricrelay-mobile.yml"

concurrency:
  group: validate-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: KMP tests, Android unit tests, lint, and compile
        working-directory: cricrelay-mobile
        run: |
          chmod +x gradlew
          ./gradlew :shared:check test :app:lintDebug :app:assembleRelease --no-daemon

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-lint-reports
          path: |
            cricrelay-mobile/**/build/reports/tests/**
            cricrelay-mobile/**/build/reports/lint-results-*.html
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: python validate_smoke.py
