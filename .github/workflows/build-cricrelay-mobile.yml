name: Build CricRelay Mobile (Android + iOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cricrelay-mobile/**"
      - ".github/workflows/build-cricrelay-mobile.yml"
      - ".github/workflows/validate-cricrelay-mobile.yml"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate-cricrelay-mobile.yml

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure release signing and Firebase
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -eu
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > cricrelay-mobile/android/app/release.keystore
          fi
          if [ -n "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > cricrelay-mobile/android/app/google-services.json
          fi

      - name: Build release APK and AAB
        working-directory: cricrelay-mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          ls -la android/app/build/outputs/apk/release/
          ls -la android/app/build/outputs/bundle/release/

      - name: Copy to static
        run: |
          cp cricrelay-mobile/android/app/build/outputs/apk/release/app-release.apk static/cricrelay-stream.apk
          cp cricrelay-mobile/android/app/build/outputs/bundle/release/app-release.aab static/cricrelay-stream.aab
          ls -la static/cricrelay-stream.apk static/cricrelay-stream.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricrelay-mobile-apk
          path: static/cricrelay-stream.apk

      - name: Upload APK to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "static/cricrelay-stream.apk"
          target: "/app/static"

      - name: Commit APK for EC2 git pull
        id: commit_apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/cricrelay-stream.apk static/cricrelay-stream.aab
          if git diff --staged --quiet; then
            echo "APK unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update CricRelay native mobile APK [skip deploy]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync repo on EC2
        if: steps.commit_apk.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            REPO="${{ github.repository }}"
            EMERGENCY_URL="https://raw.githubusercontent.com/${REPO}/main/deploy/ec2-emergency-cleanup.sh"
            GIT_SYNC_URL="https://raw.githubusercontent.com/${REPO}/main/deploy/ec2-git-sync.sh"
            curl -sfSL "$EMERGENCY_URL" | sudo bash
            curl -sfSL "$GIT_SYNC_URL" | sudo bash
            cd /app
            test -f static/cricrelay-stream.apk
            ls -la static/cricrelay-stream.apk

  build-ios:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Note on iOS build
        run: |
          echo "iOS SwiftUI shell + StreamCamera sources are in cricrelay-mobile/ios/"
          echo "Wire Xcode project + KMP framework export for signed IPA (see cricrelay-stream/docs/IOS_CI_SETUP.md patterns)"

      - name: Swift compile check (sources present)
        run: |
          test -f cricrelay-mobile/ios/CricRelay/CricRelayApp.swift
          test -f cricrelay-mobile/ios/Streaming/StreamCameraEngine.swift
          echo "iOS sources validated"
