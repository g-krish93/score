name: Migrate SQLite to RDS PostgreSQL

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm'
        required: true

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'migrate' }}
    runs-on: ubuntu-latest
    steps:
      - name: Migrate SQLite to RDS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          envs: DATABASE_URL
          script: |
            set -euo pipefail
            cd /app
            sudo chown -R ec2-user:ec2-user /app
            git -C /app pull origin main
            sudo -E bash deploy/ec2-migrate-to-rds.sh
