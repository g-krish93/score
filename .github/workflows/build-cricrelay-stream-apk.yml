name: Build CricRelay Stream APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cricrelay-stream/**"
      - ".github/workflows/build-cricrelay-stream-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android/iOS (avoid stale Gradle files)
        working-directory: cricrelay-stream
        run: |
          rm -rf android ios
          flutter create . --platforms=android,ios --org uk.co.cricrelay --project-name stream
          chmod +x android-custom/apply_android_overlay.sh
          bash android-custom/apply_android_overlay.sh

      - name: Build release APK
        working-directory: cricrelay-stream
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release 2>&1 | tee ../stream-apk-build.log
          tail -n 100 ../stream-apk-build.log
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stream-apk-build-log
          path: stream-apk-build.log

      - name: Copy to static
        run: |
          APK="cricrelay-stream/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find cricrelay-stream/build -name 'app-release.apk' -type f | head -1)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No APK found under cricrelay-stream/build"
            find cricrelay-stream/build -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          cp "$APK" static/cricrelay-stream.apk
          ls -la static/cricrelay-stream.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricrelay-stream-apk
          path: static/cricrelay-stream.apk

      - name: Commit APK for EC2 git pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/cricrelay-stream.apk
          if git diff --staged --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "chore: update CricRelay Stream APK [skip deploy]"
          git push

      - name: Sync APK to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /app
            git pull origin main
            test -f static/cricrelay-stream.apk
            ls -la static/cricrelay-stream.apk
