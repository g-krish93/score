name: Build CricRelay Stream (Android + iOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cricrelay-stream/**"
      - ".github/workflows/build-cricrelay-stream-apk.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Regenerate Android and apply overlay
        working-directory: cricrelay-stream
        run: |
          rm -rf android
          flutter create . --platforms=android --org uk.co.cricrelay --project-name stream
          sed -i 's/\r$//' android-custom/apply_android_overlay.sh
          chmod +x android-custom/apply_android_overlay.sh
          bash android-custom/apply_android_overlay.sh

      - name: Dart analyze
        working-directory: cricrelay-stream
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: cricrelay-stream
        run: |
          set -eu
          set -o pipefail
          : > ../stream-apk-build.log
          flutter --version
          flutter pub get
          flutter build apk --release 2>&1 | tee ../stream-apk-build.log
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find android/app/build build/app/outputs -type f -name 'app-release.apk' 2>/dev/null | head -1)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No release APK found:"
            find android build -type f -name '*.apk' 2>/dev/null || true
            tail -n 120 ../stream-apk-build.log || true
            exit 1
          fi
          ls -la "$APK"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stream-apk-build-log
          path: stream-apk-build.log

      - name: Copy to static
        run: |
          APK="cricrelay-stream/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find cricrelay-stream/android/app/build cricrelay-stream/build -type f -name 'app-release.apk' 2>/dev/null | head -1)"
          fi
          test -f "$APK"
          cp "$APK" static/cricrelay-stream.apk
          ls -la static/cricrelay-stream.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricrelay-stream-apk
          path: static/cricrelay-stream.apk

      - name: Commit APK for EC2 git pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/cricrelay-stream.apk
          if git diff --staged --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "chore: update CricRelay Stream APK [skip deploy]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Sync APK to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /app
            git pull origin main
            test -f static/cricrelay-stream.apk
            ls -la static/cricrelay-stream.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Regenerate iOS project
        working-directory: cricrelay-stream
        run: |
          rm -rf ios
          flutter create . --platforms=ios --org uk.co.cricrelay --project-name stream
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CricRelay Live" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Camera is used to stream live cricket." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Microphone audio is included in your live stream." ios/Runner/Info.plist

      - name: Dart analyze
        working-directory: cricrelay-stream
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Install Apple signing assets
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Prepare export options
        if: ${{ secrets.APPLE_TEAM_ID != '' }}
        working-directory: cricrelay-stream
        run: |
          sed "s/APPLE_TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" ios/ExportOptions-adhoc.plist > /tmp/ExportOptions.plist
          cat /tmp/ExportOptions.plist

      - name: Build signed IPA
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
        working-directory: cricrelay-stream
        run: |
          set -e
          flutter pub get
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
          IPA="$(find build/ios -name '*.ipa' | head -1)"
          test -n "$IPA" && test -f "$IPA"
          cp "$IPA" ../static/cricrelay-stream.ipa
          ls -la ../static/cricrelay-stream.ipa

      - name: Build iOS (compile only, no signing)
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 == '' || secrets.APPLE_PROVISIONING_PROFILE_BASE64 == '' }}
        working-directory: cricrelay-stream
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          echo "IPA not produced: add APPLE_* secrets (see cricrelay-stream/docs/IOS_CI_SETUP.md)"

      - name: Upload IPA artifact
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cricrelay-stream-ipa
          path: static/cricrelay-stream.ipa
          if-no-files-found: ignore

      - name: Commit IPA for EC2 git pull
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f static/cricrelay-stream.ipa ]; then
            echo "No IPA to commit"
            exit 0
          fi
          git add static/cricrelay-stream.ipa
          if git diff --staged --quiet; then
            echo "IPA unchanged"
            exit 0
          fi
          git commit -m "chore: update CricRelay Stream IPA [skip deploy]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Sync builds to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /app
            git pull origin main
            test -f static/cricrelay-stream.apk
            ls -la static/cricrelay-stream.apk
            if [ -f static/cricrelay-stream.ipa ]; then ls -la static/cricrelay-stream.ipa; fi
