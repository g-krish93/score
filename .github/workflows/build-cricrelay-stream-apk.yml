name: Build CricRelay Stream APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cricrelay-stream/**"
      - ".github/workflows/build-cricrelay-stream-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 3.27+ exposes flutter.* to plugin subprojects; 3.24 + package_info_plus 9.x fails Gradle.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Regenerate Android/iOS and apply overlay
        working-directory: cricrelay-stream
        run: |
          rm -rf android ios
          flutter create . --platforms=android,ios --org uk.co.cricrelay --project-name stream
          sed -i 's/\r$//' android-custom/apply_android_overlay.sh
          chmod +x android-custom/apply_android_overlay.sh
          bash android-custom/apply_android_overlay.sh

      - name: Dart analyze
        working-directory: cricrelay-stream
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: cricrelay-stream
        run: |
          set -eu
          set -o pipefail
          : > ../stream-apk-build.log
          flutter --version
          flutter pub get
          flutter build apk --release 2>&1 | tee ../stream-apk-build.log
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find android/app/build build/app/outputs -type f -name 'app-release.apk' 2>/dev/null | head -1)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No release APK found:"
            find android build -type f -name '*.apk' 2>/dev/null || true
            tail -n 120 ../stream-apk-build.log || true
            exit 1
          fi
          ls -la "$APK"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stream-apk-build-log
          path: stream-apk-build.log

      - name: Copy to static
        run: |
          APK="cricrelay-stream/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find cricrelay-stream/android/app/build cricrelay-stream/build -type f -name 'app-release.apk' 2>/dev/null | head -1)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No APK found:"
            find cricrelay-stream/android cricrelay-stream/build -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          cp "$APK" static/cricrelay-stream.apk
          ls -la static/cricrelay-stream.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricrelay-stream-apk
          path: static/cricrelay-stream.apk

      - name: Commit APK for EC2 git pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/cricrelay-stream.apk
          if git diff --staged --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "chore: update CricRelay Stream APK [skip deploy]"
          git push

      - name: Sync APK to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /app
            git pull origin main
            test -f static/cricrelay-stream.apk
            ls -la static/cricrelay-stream.apk
