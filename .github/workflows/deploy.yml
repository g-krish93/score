name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /app
            git pull origin main
            # Keep systemd unit in sync with repo (python3 -m gunicorn, optional .env).
            if [ -f deploy/cricket.service ]; then
              sudo install -m 644 deploy/cricket.service /etc/systemd/system/cricket.service
              sudo systemctl daemon-reload
            fi
            # Gunicorn runs as root and loads /usr/local/... site-packages; user pip would install under ~/.local and the worker would crash on import (exit status 3).
            # Amazon Linux often ships requests via rpm — pip cannot uninstall it; --ignore-installed lays down wheels in site-packages without removing the RPM.
            sudo pip3 install --ignore-installed -r requirements.txt
            if [ -f deploy/persist-auth-env.sh ]; then
              sudo bash deploy/persist-auth-env.sh
            fi
            sudo systemctl stop cricket || true
            sleep 2
            sudo systemctl start cricket
            sleep 4
            if ! sudo systemctl is-active --quiet cricket; then
              echo "=== journalctl -u cricket (last 120 lines) ==="
              sudo journalctl -u cricket -n 120 --no-pager || true
              exit 1
            fi
            sudo systemctl status cricket --no-pager
