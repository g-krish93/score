name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  deploy:    # APK bot commits use [skip deploy]; EC2 is updated by the APK workflow SSH step.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REDIRECT_URI: ${{ secrets.TWITCH_REDIRECT_URI }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          envs: SMTP_PASSWORD,YOUTUBE_CLIENT_ID,YOUTUBE_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,YOUTUBE_REDIRECT_URI,TWITCH_CLIENT_ID,TWITCH_CLIENT_SECRET,TWITCH_REDIRECT_URI
          script: |
            set -euo pipefail
            REPO="${{ github.repository }}"
            EMERGENCY_URL="https://raw.githubusercontent.com/${REPO}/main/deploy/ec2-emergency-cleanup.sh"
            GIT_SYNC_URL="https://raw.githubusercontent.com/${REPO}/main/deploy/ec2-git-sync.sh"
            GROW_FS_URL="https://raw.githubusercontent.com/${REPO}/main/deploy/ec2-grow-filesystem.sh"
            # Must free disk BEFORE git pull — pull fails with "No space left on device" otherwise.
            curl -sfSL "$EMERGENCY_URL" | sudo bash
            curl -sfSL "$GROW_FS_URL" | sudo bash || true
            cd /app
            sudo chown -R ec2-user:ec2-user /app
            if ! curl -sfSL "$GIT_SYNC_URL" | sudo bash; then
              echo "git sync failed — retry after second cleanup"
              curl -sfSL "$EMERGENCY_URL" | sudo bash
              sudo chown -R ec2-user:ec2-user /app
              curl -sfSL "$GIT_SYNC_URL" | sudo bash
            fi
            if [ -f deploy/ec2-disk-cleanup.sh ]; then
              sudo bash deploy/ec2-disk-cleanup.sh
            fi
            # Keep systemd unit in sync with repo (python3 -m gunicorn, optional .env).
            if [ -f deploy/cricket.service ]; then
              sudo install -m 644 deploy/cricket.service /etc/systemd/system/cricket.service
              sudo systemctl daemon-reload
            fi
            if [ -f deploy/nginx-cricrelay.conf ]; then
              sudo install -m 644 deploy/nginx-cricrelay.conf /etc/nginx/conf.d/cricrelay.conf
              if [ -f deploy/ec2-reload-nginx.sh ]; then
                sudo bash deploy/ec2-reload-nginx.sh
              else
                sudo nginx -t
                sudo mkdir -p /run/systemd/unit-root/tmp
                sudo nginx -s reload || sudo systemctl restart nginx
              fi
            fi
            # Gunicorn runs as root and loads /usr/local/... site-packages; user pip would install under ~/.local and the worker would crash on import (exit status 3).
            # Amazon Linux often ships requests via rpm — pip cannot uninstall it; --ignore-installed lays down wheels in site-packages without removing the RPM.
            # --no-cache-dir avoids filling the disk during install; skip pip when requirements.txt unchanged.
            REQ_HASH=$(sha256sum requirements.txt | awk '{print $1}')
            REQ_STAMP=/var/lib/cricrelay-requirements.sha256
            if [ -f "$REQ_STAMP" ] && [ "$(cat "$REQ_STAMP")" = "$REQ_HASH" ]; then
              echo "requirements.txt unchanged — skipping pip install"
            else
              sudo pip3 install --no-cache-dir --ignore-installed -r requirements.txt
              echo "$REQ_HASH" | sudo tee "$REQ_STAMP" > /dev/null
              if [[ -f deploy/playwright-install.sh ]]; then
                sudo APP=/app bash deploy/playwright-install.sh || {
                  echo "WARN: Playwright install failed" >&2
                }
              fi
            fi
            if [ -f deploy/persist-auth-env.sh ]; then
              sudo bash deploy/persist-auth-env.sh
            fi
            if [ -f deploy/configure-youtube-env.sh ]; then
              sudo mkdir -p /app/secrets
              if [ -n "${YOUTUBE_CLIENT_ID:-}${GOOGLE_CLIENT_ID:-}" ]; then
                printf '%s' "${YOUTUBE_CLIENT_ID:-$GOOGLE_CLIENT_ID}" | sudo tee /app/secrets/youtube_client_id > /dev/null
                sudo chmod 600 /app/secrets/youtube_client_id
              fi
              if [ -n "${YOUTUBE_CLIENT_SECRET:-}${GOOGLE_CLIENT_SECRET:-}" ]; then
                printf '%s' "${YOUTUBE_CLIENT_SECRET:-$GOOGLE_CLIENT_SECRET}" | sudo tee /app/secrets/youtube_client_secret > /dev/null
                sudo chmod 600 /app/secrets/youtube_client_secret
              fi
              sudo -E bash deploy/configure-youtube-env.sh
            fi
            if [ -f deploy/configure-twitch-env.sh ]; then
              sudo mkdir -p /app/secrets
              if [ -n "${TWITCH_CLIENT_ID:-}" ]; then
                printf '%s' "${TWITCH_CLIENT_ID}" | sudo tee /app/secrets/twitch_client_id > /dev/null
                sudo chmod 600 /app/secrets/twitch_client_id
              fi
              if [ -n "${TWITCH_CLIENT_SECRET:-}" ]; then
                printf '%s' "${TWITCH_CLIENT_SECRET}" | sudo tee /app/secrets/twitch_client_secret > /dev/null
                sudo chmod 600 /app/secrets/twitch_client_secret
              fi
              sudo -E bash deploy/configure-twitch-env.sh
            fi
            if [ -f deploy/configure-smtp-env.sh ]; then
              if [ -n "${SMTP_PASSWORD:-}" ]; then
                sudo mkdir -p /app/secrets
                printf '%s' "$SMTP_PASSWORD" | sudo tee /app/secrets/smtp_password > /dev/null
                sudo chmod 600 /app/secrets/smtp_password
              fi
              sudo bash deploy/configure-smtp-env.sh
            fi
            sudo systemctl stop cricket || true
            sleep 2
            sudo systemctl start cricket
            sleep 4
            if ! sudo systemctl is-active --quiet cricket; then
              echo "=== journalctl -u cricket (last 120 lines) ==="
              sudo journalctl -u cricket -n 120 --no-pager || true
              exit 1
            fi
            sudo systemctl status cricket --no-pager
            curl -sf http://127.0.0.1:5000/health
            echo "Deploy health check passed"