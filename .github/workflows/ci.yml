name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test (matches EC2 Python 3.9)
        run: python validate_smoke.py

      - name: Import app module
        run: python -c "from server.app import app; assert app is not None"
