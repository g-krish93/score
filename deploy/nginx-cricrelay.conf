# HTTP → HTTPS (Let's Encrypt certs under /etc/letsencrypt/live/cricrelay.co.uk/)
server {
    listen 80;
    listen [::]:80;
    server_name cricrelay.co.uk www.cricrelay.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cricrelay.co.uk www.cricrelay.co.uk;

    ssl_certificate /etc/letsencrypt/live/cricrelay.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cricrelay.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Large APKs (~50MB): serve from disk with byte-range (resume)
    location = /download/cricrelay-stream.apk {
        alias /app/static/cricrelay-stream.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="cricrelay-stream.apk"';
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=300";
    }

    location = /download/pcs-relay.apk {
        alias /app/static/pcs-relay.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="pcs-relay.apk"';
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
