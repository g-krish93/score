server {
    listen 80;
    listen [::]:80;
    server_name cricrelay.co.uk www.cricrelay.co.uk;

    # Large APKs (~50MB): serve from disk with byte-range (resume) — avoids gunicorn timeouts.
    location = /download/cricrelay-stream.apk {
        alias /app/static/cricrelay-stream.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="cricrelay-stream.apk"';
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=300";
    }

    location = /download/pcs-relay.apk {
        alias /app/static/pcs-relay.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="pcs-relay.apk"';
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
