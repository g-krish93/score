function crr(runs, overs) {
  const [o,b=0] = String(overs).split('.').map(Number);
  const t = o + b/6;
  return t > 0 ? (runs/t).toFixed(1) : '0.0';
}
function rrr(needed, balls) {
  return balls > 0 ? ((needed/balls)*6).toFixed(1) : 'n/a';
}
function toCode(full) {
  return full.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase();
}

function render(snap) {
  const isSecond = snap.inn === 2;
  const target   = snap.target || null;
  const needed   = target ? target - snap.runs : null;
  const oInt     = parseInt(snap.overs);
  const ballsDone= oInt*6 + parseInt((snap.overs.split('.')[1]||0));
  const ballsLeft= target ? MATCH.totalOvers*6 - ballsDone : null;
  const crrVal   = crr(snap.runs, snap.overs);
  const rrrVal   = (needed && ballsLeft) ? rrr(needed, ballsLeft) : null;
  let urgency    = 'ok';
  if (rrrVal) {
    const rr = parseFloat(rrrVal), cr = parseFloat(crrVal);
    if (rr > cr + 2) urgency = 'crit';
    else if (rr > cr + 0.5) urgency = 'warn';
  }

  let h = '';

  // Chase banner
  if (isSecond && target) {
    const cls = urgency === 'crit' ? 'alert-crit' : urgency === 'warn' ? 'alert-warn' : 'alert-ok';
    const icon = urgency === 'crit' ? '⚡' : urgency === 'warn' ? '⚠' : '✓';
    h += `<div class="alert-banner ${cls}">${icon} &nbsp; 2nd innings chase — Target <strong>${target}</strong> &nbsp;·&nbsp; Need <strong>${needed}</strong> from <strong>${ballsLeft}</strong> balls &nbsp;·&nbsp; RRR <strong>${rrrVal}</strong> &nbsp;·&nbsp; CRR ${crrVal}</div>`;
  }

  // Metrics
  h += `<div class="metrics">
    <div class="metric">
      <div class="metric-val">${snap.runs}/${snap.wkts}</div>
      <div class="metric-lbl">${isSecond ? '2nd innings' : '1st innings'}</div>
      <div class="metric-sub">${snap.overs} overs</div>
    </div>
    <div class="metric">
      <div class="metric-val">${crrVal}</div>
      <div class="metric-lbl">CRR</div>
    </div>`;
  if (isSecond && rrrVal) {
    h += `<div class="metric">
      <div class="metric-val ${urgency==='crit'?'red':urgency==='warn'?'orange':'green'}">${rrrVal}</div>
      <div class="metric-lbl">RRR</div>
    </div>
    <div class="metric">
      <div class="metric-val ${urgency==='crit'?'red':urgency==='warn'?'orange':'green'}">${needed}</div>
      <div class="metric-lbl">Runs needed</div>
    </div>
    <div class="metric">
      <div class="metric-val">${ballsLeft}</div>
      <div class="metric-lbl">Balls left</div>
    </div>`;
  } else {
    h += `<div class="metric">
      <div class="metric-val">${10-snap.wkts}</div>
      <div class="metric-lbl">Wkts in hand</div>
    </div>
    <div class="metric">
      <div class="metric-val">${40-oInt}</div>
      <div class="metric-lbl">Overs left</div>
    </div>`;
  }
  h += `</div>`;

  // Note
  h += `<div class="snap-note">${snap.note}</div>`;

  // Batting table
  h += `<div class="sec-head">Batting — ${isSecond ? 'East Grinstead CC' : 'Brighton Malayalee Association CC'}</div>
  <table class="tbl">
    <thead><tr>
      <th>Batter</th><th>Dismissal</th>
      <th class="r">R</th><th class="r">B</th><th class="r">4s</th><th class="r">6s</th><th class="r">SR</th>
    </tr></thead><tbody>`;

  snap.batters.forEach(b => {
    const sr   = b.balls > 0 ? ((b.r/b.balls)*100).toFixed(0) : '—';
    const cls  = b.status === 'bat' ? 'batting' : '';
    const disBadge = b.status === 'bat'
      ? `<span class="badge badge-bat">batting</span>`
      : b.status === 'out'
        ? `<span class="dim">${b.dis}</span>`
        : `<span style="color:#334155">—</span>`;
    h += `<tr class="${cls}">
      <td>${b.name}</td>
      <td>${disBadge}</td>
      <td class="r">${b.status!=='yet' ? b.r : '—'}</td>
      <td class="r">${b.balls>0 ? b.balls : '—'}</td>
      <td class="r">${b.balls>0 ? b.fours : '—'}</td>
      <td class="r">${b.balls>0 ? b.sixes : '—'}</td>
      <td class="r">${b.status!=='yet'&&b.balls>0 ? sr : '—'}</td>
    </tr>`;
  });

  const e = snap.extras;
  h += `<tr class="extras"><td colspan="2">Extras</td>
    <td class="r">${e.total}</td>
    <td colspan="3" class="dim">b${e.b} lb${e.lb} nb${e.nb} w${e.w}</td>
    <td></td></tr></tbody></table>`;

  // FOW
  if (snap.fow.length) {
    h += `<div class="sec-head">Fall of wickets</div><div class="fow-wrap">`;
    snap.fow.forEach(f => {
      h += `<div class="fow-item"><strong>${f.w}-${f.score}</strong> ${f.batter}</div>`;
    });
    h += `</div>`;
  }

  // Bowling table
  h += `<div class="sec-head">Bowling</div>
  <table class="tbl">
    <thead><tr>
      <th>Bowler</th><th class="r">O</th><th class="r">M</th><th class="r">R</th>
      <th class="r">W</th><th class="r">Wd</th><th class="r">NB</th><th class="r">Econ</th>
    </tr></thead><tbody>`;

  snap.bowlers.forEach(b => {
    const cur = b.name === snap.bowler.name;
    h += `<tr class="${cur?'bowling-current':''}">
      <td>${cur?'&#9889; ':''}${b.name}</td>
      <td class="r">${b.o}</td><td class="r">${b.m}</td><td class="r">${b.r}</td>
      <td class="r ${b.w>0?'badge-w':''}">${b.w}</td>
      <td class="r">${b.wd}</td><td class="r">${b.nb}</td>
      <td class="r">${b.econ.toFixed(1)}</td>
    </tr>`;
  });
  h += `</tbody></table>`;

  // Overlay preview
  const pillCls  = urgency==='crit'?'pill-crit':urgency==='warn'?'pill-warn':'pill-ok';
  const pillTxt  = isSecond && rrrVal
    ? (urgency==='crit' ? `⚡ ${needed} from ${ballsLeft} balls` : `RRR ${rrrVal}`)
    : `CRR ${crrVal}`;

  h += `<div class="sec-head">What the stream overlay shows at this moment</div>
  <div class="overlay-prev">
    ${isSecond && target ? `<div class="target-bar">Target <span>${target}</span> &nbsp;·&nbsp; ${needed} needed &nbsp;·&nbsp; ${ballsLeft} balls left</div>` : ''}
    <div class="overlay-label">bottom bar overlay</div>
    <div class="overlay-bar">
      <div class="ov-score-blk">
        <div class="ov-code">${isSecond ? toCode('East Grinstead CC') : MATCH.home}</div>
        <div style="display:flex;align-items:flex-end;gap:2px;">
          <span class="ov-runs">${snap.runs}</span>
          <span class="ov-wkts">/${snap.wkts}</span>
        </div>
        <div class="ov-meta">
          <div class="ov-overs">${snap.overs} ov</div>
          <div class="ov-crr">CRR ${crrVal}</div>
        </div>
      </div>
      <div class="ov-panels">
        <div class="ov-bat-blk">
          <div class="ov-batter">&#9733; ${snap.striker.name} <span>${snap.striker.r}</span><em>(${snap.striker.b})</em></div>
          <div class="ov-batter" style="opacity:0.7">${snap.nonStriker.name} <span style="color:#64748b">${snap.nonStriker.r}</span><em>(${snap.nonStriker.b})</em></div>
        </div>
        <div class="ov-sep"></div>
        <div class="ov-bowler">&#9889; ${snap.bowler.name} &nbsp; ${snap.bowler.w}-${snap.bowler.r} (${snap.bowler.o})</div>
        <div class="ov-sep"></div>
        <div class="ov-pill ${pillCls}">${pillTxt}</div>
      </div>
      <div class="ov-right">
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="live-dot" style="width:5px;height:5px;border-radius:50%;background:#22c55e;animation:blink 1.4s infinite"></div>
          <span style="font-size:0.55rem;font-weight:700;color:#22c55e;letter-spacing:.12em">LIVE</span>
        </div>
        <div class="ov-vs">${MATCH.home}<br>vs ${MATCH.away}</div>
        <div class="ov-inn">${isSecond?'2nd Inn':'1st Inn'}</div>
      </div>
    </div>
  </div>`;

  return h;
}

function init() {
  const tabs = document.getElementById('tabs');
  const content = document.getElementById('content');

  SNAPS.forEach((snap, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (snap.inn===2?' inn2':'') + (i===0?' active':'');
    btn.textContent = snap.label + (snap.inn===2?' · 2nd Inn':'');
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      content.innerHTML = render(snap);
    };
    tabs.appendChild(btn);
  });

  content.innerHTML = render(SNAPS[0]);
}

init();
</script>
</body>
</html>
