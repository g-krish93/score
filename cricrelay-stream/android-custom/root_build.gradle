allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// Library plugins (package_info_plus, etc.) read flutter.* on Flutter <3.27.
ext.flutter = [
    compileSdkVersion: 35,
    minSdkVersion    : 24,
    targetSdkVersion : 35,
    ndkVersion       : "27.0.12077973",
]

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
