name: cricrelay_stream
description: CricRelay Stream — one-phone YouTube live with burned-in score overlay.
publish_to: "none"
version: 1.2.5+8

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  webview_flutter_wkwebview: ^3.16.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.3.1
  # Pin: ^1.2.8 resolves to 1.4.x → package_info_plus 9.x breaks Flutter 3.24 Gradle.
  wakelock_plus: 1.2.8
  camera: ^0.11.0+2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.1.4
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.3.6
  package_info_plus: 8.3.1

dependency_overrides:
  package_info_plus: 8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
