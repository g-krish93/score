  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tends DCLogic {\n  constructor(props) {\n    super(props);\n    this.androidRef = React.createRef();\n    this.iosRef = React.createRef();\n    this.t = 0;\n    this.last = null;\n    this.raf = null;\n    this.saveAt = 0;\n  }\n\n  componentDidMount() {\n    const saved = parseFloat(localStorage.getItem('cricrelay_splash1e_v2_t'));\n    if (!isNaN(saved)) this.t = Math.min(saved, this.DUR);\n    const loop = (ts) => {\n      if (this.last == null) this.last = ts;\n      const dt = Math.min(0.05, (ts - this.last) / 1000);\n      this.last = ts;\n      if (this.t < this.DUR) this.t = Math.min(this.DUR, this.t + dt * 1.95); // ~2.7s total\n      if (ts - this.saveAt > 250) { this.saveAt = ts; try { localStorage.setItem('cricrelay_splash1e_v2_t', String(this.t)); } catch (e) {} }\n      this.draw(this.androidRef.current);\n      this.draw(this.iosRef.current);\n      this.raf = requestAnimationFrame(loop);\n    };\n    this.raf = requestAnimationFrame(loop);\n  }\n\n  componentWillUnmount() { cancelAnimationFrame(this.raf); }\n\n  get DUR() { return 5.2; }\n\n  // ---- helpers ----\n  ease(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }\n  // extra-silky ease for camera moves\n  easeIO(x) { return x <= 0 ? 0 : x >= 1 ? 1 : (x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2); }\n\n  camera(t) {\n    // extreme close-up on the ball -> pull back to umpire view between 0.9 and 2.6\n    const k = this.easeIO((t - 0.6) / 1.1);\n    const lerp = (a, b) => a + (b - a) * k;\n    let cam = { x: lerp(0, -0.30), y: lerp(0.55, 1.9), z: lerp(0.6, -2.6), tilt: lerp(0, 0.10) };\n    // tracking shot: camera chases the ball down the pitch, settling ~3/4 of the way when it hits\n    if (t > this.T_REL) {\n      const kd = this.easeIO(Math.min(1, (t - this.T_REL) / (this.T_HIT - this.T_REL)));\n      const p = Math.min(1, (t - this.T_REL) / (this.T_HIT - this.T_REL));\n      // blend from wherever the pull-back currently is — no hitch between the two moves\n      cam.z += (17.3 - cam.z) * kd; // ends ~1/4 pitch from the stumps\n      cam.y += (1.15 - cam.y) * kd;\n      cam.tilt += (0.16 - cam.tilt) * kd;\n      cam.x += (this.ballAt(this.pMap(p)).x * 0.5 - cam.x) * kd;\n    }\n    // handheld drift — subtle organic float on top of everything\n    cam.x += Math.sin(t * 1.7) * 0.009 + Math.sin(t * 3.9 + 1.2) * 0.004;\n    cam.y += Math.sin(t * 2.3 + 0.5) * 0.006;\n    // impact shake\n    const imp = t - this.T_HIT;\n    if (imp > 0 && imp < 0.45) {\n      const s = (0.45 - imp) * 0.14;\n      cam.x += Math.sin(t * 90) * s;\n      cam.y += Math.cos(t * 77) * s;\n    }\n    return cam;\n  }\n\n  get T_REL() { return 1.45; }  // ball release — overlaps the tail of the pull-back, no dead beat\n  get T_HIT() { return 2.8; }   // stump impact\n  get T_LOGO() { return 3.5; }\n\n  // broadcast-style speed ramp: quick off the hand, slow-mo through the swing, snap at the stumps\n  pMap(u) {\n    if (u < 0.55) return u * (0.75 / 0.55);\n    if (u < 0.9) return 0.75 + (u - 0.55) * (0.15 / 0.35);\n    return 0.9 + (u - 0.9);\n  }\n\n  ballAt(p) {\n    // p 0..1 across delivery; returns world pos\n    const pitchP = 0.66;\n    const z = 0.6 + p * 19.5;\n    let y, x;\n    if (p < pitchP) {\n      const q = p / pitchP;\n      y = 0.05 + 1.95 * (1 - q * q);\n      x = -0.38 * (1 - Math.sin(q * Math.PI / 2)); // smooth inswing curve\n    } else {\n      const q = (p - pitchP) / (1 - pitchP);\n      y = 0.05 + 1.35 * q * (1.25 - q); // bounce up toward stump height\n      x = 0.0 - 0.04 * q; // slight jag after pitching\n    }\n    return { x, y, z };\n  }\n\n  project(px, py, pz, cam, W, H, f) {\n    const dx = px - cam.x, dy = py - cam.y, dz = pz - cam.z;\n    const c = Math.cos(cam.tilt), s = Math.sin(cam.tilt);\n    const zv = -dy * s + dz * c;\n    const yv = dy * c + dz * s;\n    if (zv < 0.12) return null;\n    return { x: W / 2 + f * dx / zv, y: H / 2 - f * yv / zv, d: zv };\n  }\n\n  draw(canvas) {\n    if (!canvas) return;\n    const dpr = window.devicePixelRatio || 1;\n    let cw = canvas.clientWidth, ch = canvas.clientHeight;\n    if (ch < 120) ch = 700;\n    if (cw < 120) cw = 360;\n    if (canvas.width !== cw * dpr) { canvas.width = cw * dpr; canvas.height = ch * dpr; }\n    const ctx = canvas.getContext('2d');\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    const W = cw, H = ch, t = this.t;\n    const LIME = '#D8C9A3', DARK = '#131A10', INK = '#2E5E32', BALLC = '#D6472E', SEAMC = '#F5EFDF';\n    const f = H * 0.95;\n    const cam = this.camera(t);\n    const P = (x, y, z) => this.project(x, y, z, cam, W, H, f);\n\n    ctx.fillStyle = DARK;\n    ctx.fillRect(0, 0, W, H);\n\n    // ---- night-stadium floodlights ----\n    [[-9, 6.5, 26], [9, 6.5, 26], [-11, 5.5, 4], [11, 5.5, 4]].forEach((fp) => {\n      const lp = P(fp[0], fp[1], fp[2]);\n      if (!lp) return;\n      const lr = Math.max(20, f * 3.2 / lp.d);\n      const g = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, lr);\n      g.addColorStop(0, 'rgba(245,238,220,0.22)');\n      g.addColorStop(0.35, 'rgba(216,201,163,0.08)');\n      g.addColorStop(1, 'rgba(216,201,163,0)');\n      ctx.fillStyle = g;\n      ctx.beginPath(); ctx.arc(lp.x, lp.y, lr, 0, 7); ctx.fill();\n      ctx.fillStyle = 'rgba(245,240,225,0.85)';\n      const bw = Math.max(4, f * 0.5 / lp.d);\n      ctx.fillRect(lp.x - bw / 2, lp.y - bw / 8, bw, bw / 4);\n    });\n\n    // ---- pitch strip ----\n    const corners = [P(-1.55, 0, -1), P(1.55, 0, -1), P(1.55, 0, 21.2), P(-1.55, 0, 21.2)];\n    if (corners.every(Boolean)) {\n      ctx.beginPath();\n      ctx.moveTo(corners[0].x, corners[0].y);\n      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);\n      ctx.closePath();\n      ctx.fillStyle = '#33301F';\n      ctx.fill();\n      ctx.strokeStyle = 'rgba(216,201,163,0.28)';\n      ctx.lineWidth = 1.5;\n      ctx.stroke();\n      // mowing stripes\n      for (let z0 = 0; z0 < 20.4; z0 += 2.55) {\n        if (Math.round(z0 / 2.55) % 2) continue;\n        const q = [P(-1.55, 0, z0), P(1.55, 0, z0), P(1.55, 0, Math.min(21.2, z0 + 2.55)), P(-1.55, 0, Math.min(21.2, z0 + 2.55))];\n        if (!q.every(Boolean)) continue;\n        ctx.beginPath();\n        ctx.moveTo(q[0].x, q[0].y);\n        for (let i = 1; i < 4; i++) ctx.lineTo(q[i].x, q[i].y);\n        ctx.closePath();\n        ctx.fillStyle = 'rgba(216,201,163,0.045)';\n        ctx.fill();\n      }\n    }\n    // crease lines (both ends) + centre guide\n    const line = (a, b, alpha, w) => {\n      const p1 = P(a[0], a[1], a[2]), p2 = P(b[0], b[1], b[2]);\n      if (!p1 || !p2) return;\n      ctx.strokeStyle = 'rgba(216,201,163,' + alpha + ')';\n      ctx.lineWidth = w;\n      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();\n    };\n    line([-1.3, 0, 18.9], [1.3, 0, 18.9], 0.55, 2);   // popping crease (batting end)\n    line([-1.3, 0, 20.1], [1.3, 0, 20.1], 0.35, 1.5); // bowling crease far\n    line([-1.3, 0, 1.2], [1.3, 0, 1.2], 0.55, 2);     // near crease\n    ctx.setLineDash([6, 8]);\n    line([0, 0, 1.4], [0, 0, 18.7], 0.14, 1.2);\n    ctx.setLineDash([]);\n\n    // ---- stumps at far end ----\n    const hitP = Math.max(0, Math.min(1, (t - this.T_HIT) * 2.6));\n    ctx.shadowColor = LIME; ctx.shadowBlur = 14;\n    for (let i = -1; i <= 1; i++) {\n      const sx = i * 0.14;\n      let topX = sx, topY = 0.72, topZ = 20.1;\n      if (i === 0 && hitP > 0) { // middle stump knocked back\n        const ang = hitP * 1.1;\n        topY = 0.72 * Math.cos(ang);\n        topZ = 20.1 + 0.72 * Math.sin(ang);\n      }\n      const b = P(sx, 0, 20.1), tp = P(topX, topY, topZ);\n      if (b && tp) {\n        ctx.strokeStyle = LIME;\n        ctx.lineWidth = Math.max(2, f * 0.045 / b.d);\n        ctx.lineCap = 'round';\n        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();\n      }\n    }\n    // bails\n    if (hitP <= 0) {\n      const b1 = P(-0.07, 0.745, 20.1), b2 = P(0.07, 0.745, 20.1);\n      if (b1 && b2) {\n        ctx.strokeStyle = LIME; ctx.lineWidth = Math.max(1.5, f * 0.03 / b1.d);\n        ctx.beginPath(); ctx.moveTo(b1.x - 4, b1.y); ctx.lineTo(b1.x + 4, b1.y); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(b2.x - 4, b2.y); ctx.lineTo(b2.x + 4, b2.y); ctx.stroke();\n      }\n    } else {\n      // flying bails\n      const bt = (t - this.T_HIT);\n      [[-0.07, -0.9, 2.4, 1.6], [0.07, 0.7, 3.1, 2.0]].forEach((b) => {\n        let bx = b[0] + b[1] * bt * 0.4;\n        let by = 0.745 + b[2] * bt - 4.9 * bt * bt;\n        let bz = 20.1 + b[3] * bt * 0.5;\n        if (by < 0.02) by = 0.02;\n        const pp = P(bx, by, bz);\n        if (pp) {\n          ctx.save();\n          ctx.translate(pp.x, pp.y);\n          ctx.rotate(bt * 9 * (b[0] < 0 ? -1 : 1));\n          ctx.strokeStyle = LIME; ctx.lineWidth = 2;\n          ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.stroke();\n          ctx.restore();\n        }\n      });\n    }\n    ctx.shadowBlur = 0;\n\n    // ---- ball ----\n    let ball = null;\n    const spin = t < 1.3 ? 3.6 * t : 3.6 * 1.3 + 16 * (t - 1.3); // slow, readable spin up close, then rips\n    if (t < this.T_REL) {\n      // one continuous ball: close-up pos glides into the release point as the camera pulls back\n      const k2 = this.easeIO((t - 0.5) / 0.95);\n      ball = {\n        x: -0.38 * k2,\n        y: 0.55 + Math.sin(t * 2.2) * 0.012 * (1 - k2) + 1.45 * k2,\n        z: 1.0 - 0.4 * k2,\n      };\n    } else if (t < this.T_HIT) {\n      const p = this.pMap((t - this.T_REL) / (this.T_HIT - this.T_REL));\n      ball = this.ballAt(p);\n      // trail\n      for (let k = 1; k <= 7; k++) {\n        const tp2 = p - k * 0.035;\n        if (tp2 <= 0) break;\n        const w = this.ballAt(tp2);\n        const sp = P(w.x, w.y, w.z);\n        if (sp) {\n          const r = Math.max(1, f * 0.075 / sp.d) * (1 - k * 0.11);\n          ctx.fillStyle = 'rgba(214,71,46,' + (0.28 * (1 - k / 8)) + ')';\n          ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 7); ctx.fill();\n        }\n      }\n      // bounce flash on the deck\n      const pitchT = this.T_REL + 0.66 * (this.T_HIT - this.T_REL);\n      const bf = t - pitchT;\n      if (bf > 0 && bf < 0.35) {\n        const w = this.ballAt(0.66);\n        const sp = P(w.x, 0, w.z);\n        if (sp) {\n          ctx.strokeStyle = 'rgba(216,201,163,' + (0.7 * (1 - bf / 0.35)) + ')';\n          ctx.lineWidth = 2;\n          ctx.beginPath();\n          ctx.ellipse(sp.x, sp.y, 30 * bf / 0.35 * (f * 0.02 / sp.d) * 30, 10 * bf / 0.35 * (f * 0.02 / sp.d) * 12, 0, 0, 7);\n          ctx.stroke();\n        }\n      }\n    }\n    if (ball) {\n      const sp = P(ball.x, ball.y, ball.z);\n      if (sp) {\n        const r = Math.max(3, f * 0.075 / sp.d);\n        ctx.shadowColor = BALLC; ctx.shadowBlur = r * 1.6;\n        ctx.fillStyle = BALLC;\n        ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 7); ctx.fill();\n        ctx.shadowBlur = 0;\n        // rotating seam: two dashed chords, like the logo\n        ctx.save();\n        ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 7); ctx.clip();\n        ctx.translate(sp.x, sp.y); ctx.rotate(spin % (Math.PI * 2));\n        ctx.strokeStyle = SEAMC;\n        ctx.lineWidth = Math.max(1.2, r * 0.14);\n        ctx.setLineDash([r * 0.35, r * 0.28]);\n        ctx.beginPath(); ctx.moveTo(-r * 0.22, -r * 1.2); ctx.lineTo(-r * 0.22, r * 1.2); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(r * 0.22, -r * 1.2); ctx.lineTo(r * 0.22, r * 1.2); ctx.stroke();\n        ctx.setLineDash([]);\n        ctx.restore();\n      }\n    }\n\n    // ---- impact flash ----\n    const fl = t - this.T_HIT;\n    if (fl > 0 && fl < 0.09) {\n      ctx.fillStyle = 'rgba(242,232,204,' + (0.5 * (1 - fl / 0.09)) + ')';\n      ctx.fillRect(0, 0, W, H);\n    }\n    if (fl > 0 && fl < 0.5) {\n      const sp = P(0, 0.45, 20.0);\n      if (sp) {\n        const a = 1 - fl / 0.5;\n        const g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, 90);\n        g.addColorStop(0, 'rgba(216,201,163,' + 0.75 * a + ')');\n        g.addColorStop(1, 'rgba(216,201,163,0)');\n        ctx.fillStyle = g;\n        ctx.beginPath(); ctx.arc(sp.x, sp.y, 90, 0, 7); ctx.fill();\n      }\n    }\n\n    // ---- cinematic grade: vignette + letterbox + fade-in ----\n    const laPre = this.ease((t - this.T_LOGO) / 0.8);\n    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.72);\n    vg.addColorStop(0, 'rgba(0,0,0,0)');\n    vg.addColorStop(1, 'rgba(0,0,0,0.55)');\n    ctx.fillStyle = vg;\n    ctx.fillRect(0, 0, W, H);\n    const barH = H * 0.08 * (1 - laPre);\n    if (barH > 0.5) {\n      ctx.fillStyle = '#000';\n      ctx.fillRect(0, 0, W, barH);\n      ctx.fillRect(0, H - barH, W, barH);\n    }\n    if (t < 0.4) {\n      ctx.fillStyle = 'rgba(0,0,0,' + (1 - t / 0.4) + ')';\n      ctx.fillRect(0, 0, W, H);\n    }\n\n    // ---- wordmark ----\n    const la = this.ease((t - this.T_LOGO) / 0.8);\n    if (la > 0) {\n      ctx.save();\n      ctx.globalAlpha = la;\n      ctx.fillStyle = '#F5F3EC';\n      ctx.fillRect(0, 0, W, H);\n      // zoom-in: lockup grows in with a long silky settle\n      const zs = 1 - 0.65 * Math.pow(1 - la, 3);\n      ctx.translate(W / 2, H / 2); ctx.scale(zs, zs); ctx.translate(-W / 2, -H / 2);\n      const cy = H * 0.44;\n      // 1e pitch-mark logo: green rounded square, cream pitch, crease ticks\n      const roundRect = (x, y, w2, h2, rad) => {\n        ctx.beginPath();\n        ctx.moveTo(x + rad, y);\n        ctx.arcTo(x + w2, y, x + w2, y + h2, rad);\n        ctx.arcTo(x + w2, y + h2, x, y + h2, rad);\n        ctx.arcTo(x, y + h2, x, y, rad);\n        ctx.arcTo(x, y, x + w2, y, rad);\n        ctx.closePath();\n      };\n      const S = 84, lx = W / 2 - S / 2, ly = cy - 120;\n      ctx.fillStyle = '#2E5E32';\n      roundRect(lx, ly, S, S, 19); ctx.fill();\n      ctx.fillStyle = '#D8C9A3';\n      roundRect(W / 2 - 13, ly + 15, 26, 54, 7); ctx.fill();\n      ctx.fillStyle = '#2E5E32';\n      ctx.fillRect(W / 2 - 8, ly + 22, 16, 2.6);\n      ctx.fillRect(W / 2 - 8, ly + 59.4, 16, 2.6);\n      // name\n      ctx.fillStyle = '#2E5E32';\n      ctx.textAlign = 'center';\n      ctx.font = '800 42px Archivo, sans-serif';\n      ctx.fillText('cricrelay', W / 2, cy + 32);\n      ctx.font = '500 16px \"DM Sans\", sans-serif';\n      ctx.fillStyle = 'rgba(47,42,36,0.6)';\n      ctx.fillText(this.props.tagline ?? \"your club's home ground\", W / 2, cy + 64);\n      if (t > this.DUR - 0.6) {\n        ctx.font = '500 13px \"DM Sans\", sans-serif';\n        ctx.fillStyle = 'rgba(47,42,36,0.35)';\n        ctx.fillText('tap to replay', W / 2, H - 36);\n      }\n      ctx.restore();\n    }\n  }\n\n  renderVals() {\n    return {\n      androidRef: this.androidRef,\n      iosRef: this.iosRef,\n      replay: () => { this.t = 0; try { localStorage.setItem('cricrelay_splash1e_v2_t', '0'); } catch (e) {} },\n    };\n  }\n}\n\nconst comp = new Component({});\ncomp.androidRef.current = document.getElementById('stage');\ncomp.iosRef.current = null;\ndocument.getElementById('stage').addEventListener('click', () => comp.renderVals().replay());\ncomp.componentDidMount();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
