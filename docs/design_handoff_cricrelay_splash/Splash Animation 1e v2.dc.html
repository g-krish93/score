<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #1A1C1A; font-family: 'DM Sans', sans-serif; }
  </style>
</helmet>

<section style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 40px 24px 64px; box-sizing: border-box;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <span style="font-family: 'Archivo'; font-weight: 900; font-size: 22px; color: #D8C9A3; letter-spacing: -0.5px;">cricrelay — opening splash · logo 1e · v2 (zoom-in, faster)</span>
    <span style="font-size: 14px; color: #9BA39B;">Top-of-pitch camera → umpire view → ball swings in → stumps · tap a screen to replay</span>
  </div>
  <div style="display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <x-import component-from-global-scope="AndroidDevice" from="./android-frame.jsx" dark="{{ true }}" hint-size="380px,780px">
        <canvas ref="{{ androidRef }}" onClick="{{ replay }}" style="width: 100%; height: 100%; display: block; background: #131A10; cursor: pointer;"></canvas>
      </x-import>
      <span style="font-size: 13px; color: #9BA39B;">Android</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="380px,780px">
        <canvas ref="{{ iosRef }}" onClick="{{ replay }}" style="width: 100%; height: 100%; display: block; background: #131A10; cursor: pointer;"></canvas>
      </x-import>
      <span style="font-size: 13px; color: #9BA39B;">iOS</span>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tagline&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;your club\u0027s home ground&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;$preview&quot;: {&quot;width&quot;: 1000, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.androidRef = React.createRef();
    this.iosRef = React.createRef();
    this.t = 0;
    this.last = null;
    this.raf = null;
    this.saveAt = 0;
  }

  componentDidMount() {
    // pre-bake a film-grain tile
    const nc = document.createElement('canvas');
    nc.width = nc.height = 128;
    const nx = nc.getContext('2d');
    const nid = nx.createImageData(128, 128);
    for (let i = 0; i < nid.data.length; i += 4) {
      const v = Math.random() * 255;
      nid.data[i] = v; nid.data[i + 1] = v; nid.data[i + 2] = v; nid.data[i + 3] = 18;
    }
    nx.putImageData(nid, 0, 0);
    this.noiseC = nc;
    const saved = parseFloat(localStorage.getItem('cricrelay_splash1e_v2_t'));
    if (!isNaN(saved)) this.t = Math.min(saved, this.DUR);
    const loop = (ts) => {
      if (this.last == null) this.last = ts;
      const dt = Math.min(0.05, (ts - this.last) / 1000);
      this.last = ts;
      if (this.t < this.DUR) this.t = Math.min(this.DUR, this.t + dt * (160 / 63)); // 30% shorter → ~2s total
      if (ts - this.saveAt > 250) { this.saveAt = ts; try { localStorage.setItem('cricrelay_splash1e_v2_t', String(this.t)); } catch (e) {} }
      this.draw(this.androidRef.current);
      this.draw(this.iosRef.current);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  get DUR() { return 5.2; }

  // ---- helpers ----
  ease(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }
  // premium camera easing — long elegant settle
  easeIO(x) { return x <= 0 ? 0 : x >= 1 ? 1 : (x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2); }
  easeOutBack(x) { if (x <= 0) return 0; if (x >= 1) return 1; const c = 1.20158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }

  camera(t) {
    // extreme close-up on the ball -> pull back to umpire view between 0.9 and 2.6
    const k = this.easeIO((t - 0.6) / 1.1);
    const lerp = (a, b) => a + (b - a) * k;
    let cam = { x: lerp(0, -0.30), y: lerp(0.55, 1.9), z: lerp(0.6, -2.6), tilt: lerp(0, 0.10) };
    // tracking shot: camera chases the ball down the pitch, settling ~3/4 of the way when it hits
    if (t > this.T_REL) {
      const kd = this.easeIO(Math.min(1, (t - this.T_REL) / (this.T_HIT - this.T_REL)));
      const p = Math.min(1, (t - this.T_REL) / (this.T_HIT - this.T_REL));
      // blend from wherever the pull-back currently is — no hitch between the two moves
      cam.z += (14.6 - cam.z) * kd;
      cam.y += (1.35 - cam.y) * kd;
      cam.tilt += (0.13 - cam.tilt) * kd;
      cam.x += (this.ballAt(this.pMap(p)).x * 0.5 - cam.x) * kd;
    }
    // handheld drift — subtle organic float on top of everything
    cam.x += Math.sin(t * 1.7) * 0.014 + Math.sin(t * 3.9 + 1.2) * 0.007;
    cam.y += Math.sin(t * 2.3 + 0.5) * 0.010;
    // impact shake
    const imp = t - this.T_HIT;
    if (imp > 0 && imp < 0.45) {
      const s = (0.45 - imp) * 0.10;
      cam.x += Math.sin(t * 90) * s;
      cam.y += Math.cos(t * 77) * s;
    }
    return cam;
  }

  get T_REL() { return 1.45; }  // ball release — overlaps the tail of the pull-back, no dead beat
  get T_HIT() { return 2.8; }   // stump impact
  get T_LOGO() { return 3.5; }

  // broadcast-style speed ramp: quick off the hand, slow-mo through the swing, snap at the stumps
  pMap(u) {
    if (u < 0.55) return u * (0.75 / 0.55);
    if (u < 0.9) return 0.75 + (u - 0.55) * (0.15 / 0.35);
    return 0.9 + (u - 0.9);
  }

  ballAt(p) {
    // p 0..1 across delivery; returns world pos
    const pitchP = 0.66;
    const z = 0.6 + p * 19.5;
    let y, x;
    if (p < pitchP) {
      const q = p / pitchP;
      y = 0.05 + 1.95 * (1 - q * q);
      x = -0.38 * (1 - Math.sin(q * Math.PI / 2)); // smooth inswing curve
    } else {
      const q = (p - pitchP) / (1 - pitchP);
      y = 0.05 + 1.35 * q * (1.25 - q); // bounce up toward stump height
      x = 0.0 - 0.04 * q; // slight jag after pitching
    }
    return { x, y, z };
  }

  project(px, py, pz, cam, W, H, f) {
    const dx = px - cam.x, dy = py - cam.y, dz = pz - cam.z;
    const c = Math.cos(cam.tilt), s = Math.sin(cam.tilt);
    const zv = -dy * s + dz * c;
    const yv = dy * c + dz * s;
    if (zv < 0.12) return null;
    return { x: W / 2 + f * dx / zv, y: H / 2 - f * yv / zv, d: zv };
  }

  draw(canvas) {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    let cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (ch < 120) ch = 700;
    if (cw < 120) cw = 360;
    if (canvas.width !== cw * dpr) { canvas.width = cw * dpr; canvas.height = ch * dpr; }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = cw, H = ch, t = this.t;
    const LIME = '#D8C9A3', DARK = '#131A10', INK = '#2E5E32', BALLC = '#D6472E', SEAMC = '#F5EFDF';
    const f = H * 0.95;
    const cam = this.camera(t);
    const P = (x, y, z) => this.project(x, y, z, cam, W, H, f);

    // ---- sky + ground: graded night atmosphere ----
    const horP = P(0, 0, 120);
    const horY = horP ? Math.max(H * 0.10, Math.min(H * 0.62, horP.y)) : H * 0.30;
    const skyG = ctx.createLinearGradient(0, 0, 0, horY);
    skyG.addColorStop(0, '#08111A'); // deep teal night
    skyG.addColorStop(0.7, '#0E141A');
    skyG.addColorStop(1, '#191A11'); // warm sodium horizon
    ctx.fillStyle = skyG;
    ctx.fillRect(0, 0, W, horY + 1);
    const fldG = ctx.createLinearGradient(0, horY, 0, H);
    fldG.addColorStop(0, '#191A11');
    fldG.addColorStop(0.5, '#12150D');
    fldG.addColorStop(1, '#080B07');
    ctx.fillStyle = fldG;
    ctx.fillRect(0, horY, W, H - horY);
    // warm light pools spilling onto the outfield
    [[-5.5, 0, 9], [5.5, 0, 9]].forEach((pp) => {
      const lp = P(pp[0], pp[1], pp[2]);
      if (!lp) return;
      const pr = Math.max(40, f * 5.5 / lp.d);
      const g = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, pr);
      g.addColorStop(0, 'rgba(255,235,195,0.05)');
      g.addColorStop(1, 'rgba(255,235,195,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(lp.x, lp.y, pr, pr * 0.4, 0, 0, 7); ctx.fill();
    });

    // ---- night-stadium floodlights ----
    [[-9, 6.5, 26], [9, 6.5, 26], [-11, 5.5, 4], [11, 5.5, 4]].forEach((fp) => {
      const lp = P(fp[0], fp[1], fp[2]);
      if (!lp) return;
      const lr = Math.max(14, f * 2.3 / lp.d);
      const g = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, lr);
      g.addColorStop(0, 'rgba(255,241,214,0.34)'); // warm tungsten
      g.addColorStop(0.3, 'rgba(235,215,180,0.05)');
      g.addColorStop(1, 'rgba(235,215,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(lp.x, lp.y, lr, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(238,242,250,0.85)';
      const bw = Math.max(4, f * 0.5 / lp.d);
      ctx.fillRect(lp.x - bw / 2, lp.y - bw / 8, bw, bw / 4);
    });

    // ---- pitch strip ----
    const corners = [P(-1.55, 0, -1), P(1.55, 0, -1), P(1.55, 0, 21.2), P(-1.55, 0, 21.2)];
    if (corners.every(Boolean)) {
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      const pitG = ctx.createLinearGradient(0, corners[2].y, 0, corners[0].y);
      pitG.addColorStop(0, '#2A2415'); // far end sinks into haze
      pitG.addColorStop(0.55, '#463C24'); // warm amber under the lights
      pitG.addColorStop(1, '#3C3420');
      ctx.fillStyle = pitG;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // mowing stripes
      for (let z0 = 0; z0 < 20.4; z0 += 2.55) {
        if (Math.round(z0 / 2.55) % 2) continue;
        const q = [P(-1.55, 0, z0), P(1.55, 0, z0), P(1.55, 0, Math.min(21.2, z0 + 2.55)), P(-1.55, 0, Math.min(21.2, z0 + 2.55))];
        if (!q.every(Boolean)) continue;
        ctx.beginPath();
        ctx.moveTo(q[0].x, q[0].y);
        for (let i = 1; i < 4; i++) ctx.lineTo(q[i].x, q[i].y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.028)';
        ctx.fill();
      }
    }
    // crease lines (both ends) + centre guide
    const line = (a, b, alpha, w) => {
      const p1 = P(a[0], a[1], a[2]), p2 = P(b[0], b[1], b[2]);
      if (!p1 || !p2) return;
      ctx.strokeStyle = 'rgba(238,238,228,' + alpha * 0.85 + ')';
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    };
    line([-1.3, 0, 18.9], [1.3, 0, 18.9], 0.55, 2);   // popping crease (batting end)
    line([-1.3, 0, 20.1], [1.3, 0, 20.1], 0.35, 1.5); // bowling crease far
    line([-1.3, 0, 1.2], [1.3, 0, 1.2], 0.55, 2);     // near crease
    // atmospheric haze hanging over the far end
    const hzG = ctx.createLinearGradient(0, horY - H * 0.05, 0, horY + H * 0.12);
    hzG.addColorStop(0, 'rgba(185,175,150,0)');
    hzG.addColorStop(0.45, 'rgba(185,175,150,0.08)');
    hzG.addColorStop(1, 'rgba(185,175,150,0)');
    ctx.fillStyle = hzG;
    ctx.fillRect(0, horY - H * 0.05, W, H * 0.17);

    // ---- stumps at far end ----
    const hitP = Math.max(0, Math.min(1, (t - this.T_HIT) * 2.6));
    // soft contact shadow at the base of the set
    const sb = P(0, 0, 20.1);
    if (sb) {
      ctx.fillStyle = 'rgba(0,0,0,0.30)';
      ctx.beginPath(); ctx.ellipse(sb.x, sb.y + 1, Math.max(6, f * 0.26 / sb.d), Math.max(2, f * 0.05 / sb.d), 0, 0, 7); ctx.fill();
    }
    for (let i = -1; i <= 1; i++) {
      const sx = i * 0.14;
      let topX = sx, topY = 0.72, topZ = 20.1;
      if (i === 0 && hitP > 0) { // middle stump knocked back
        const ang = hitP * 1.1;
        topY = 0.72 * Math.cos(ang);
        topZ = 20.1 + 0.72 * Math.sin(ang);
      }
      const b = P(sx, 0, 20.1), tp = P(topX, topY, topZ);
      if (b && tp) {
        const lw = Math.max(2, f * 0.045 / b.d);
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#E0D3AE'; // pale willow
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
        // shaded edge for roundness
        ctx.strokeStyle = 'rgba(80,66,42,0.55)';
        ctx.lineWidth = lw * 0.32;
        ctx.beginPath(); ctx.moveTo(b.x + lw * 0.28, b.y); ctx.lineTo(tp.x + lw * 0.28, tp.y); ctx.stroke();
        // specular sliver from the floodlights
        ctx.strokeStyle = 'rgba(255,252,240,0.5)';
        ctx.lineWidth = lw * 0.18;
        ctx.beginPath(); ctx.moveTo(b.x - lw * 0.24, b.y); ctx.lineTo(tp.x - lw * 0.24, tp.y); ctx.stroke();
      }
    }
    // bails
    if (hitP <= 0) {
      const b1 = P(-0.07, 0.745, 20.1), b2 = P(0.07, 0.745, 20.1);
      if (b1 && b2) {
        ctx.strokeStyle = '#E0D3AE'; ctx.lineWidth = Math.max(1.5, f * 0.03 / b1.d);
        ctx.beginPath(); ctx.moveTo(b1.x - 4, b1.y); ctx.lineTo(b1.x + 4, b1.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(b2.x - 4, b2.y); ctx.lineTo(b2.x + 4, b2.y); ctx.stroke();
      }
    } else {
      // flying bails
      const bt = (t - this.T_HIT);
      [[-0.07, -0.9, 2.4, 1.6], [0.07, 0.7, 3.1, 2.0]].forEach((b) => {
        let bx = b[0] + b[1] * bt * 0.4;
        let by = 0.745 + b[2] * bt - 4.9 * bt * bt;
        let bz = 20.1 + b[3] * bt * 0.5;
        if (by < 0.02) by = 0.02;
        const pp = P(bx, by, bz);
        if (pp) {
          ctx.save();
          ctx.translate(pp.x, pp.y);
          ctx.rotate(bt * 9 * (b[0] < 0 ? -1 : 1));
          ctx.strokeStyle = '#E0D3AE'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.stroke();
          ctx.restore();
        }
      });
    }
    ctx.shadowBlur = 0;

    // ---- ball ----
    let ball = null;
    const spin = t < 1.3 ? 3.6 * t : 3.6 * 1.3 + 16 * (t - 1.3); // slow, readable spin up close, then rips
    if (t < this.T_REL) {
      // one continuous ball: close-up pos glides into the release point as the camera pulls back
      const k2 = this.ease((t - 0.5) / 0.95);
      ball = {
        x: -0.38 * k2,
        y: 0.55 + Math.sin(t * 2.2) * 0.012 * (1 - k2) + 1.45 * k2,
        z: 1.0 - 0.4 * k2,
      };
    } else if (t < this.T_HIT) {
      const p = this.pMap((t - this.T_REL) / (this.T_HIT - this.T_REL));
      ball = this.ballAt(p);
      // trail
      for (let k = 1; k <= 7; k++) {
        const tp2 = p - k * 0.035;
        if (tp2 <= 0) break;
        const w = this.ballAt(tp2);
        const sp = P(w.x, w.y, w.z);
        if (sp) {
          const r = Math.max(1, f * 0.075 / sp.d) * (1 - k * 0.11);
          ctx.fillStyle = 'rgba(226,110,80,' + (0.10 * (1 - k / 8)) + ')'; // faint motion smear, not a comet
          ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 7); ctx.fill();
        }
      }
      // bounce flash on the deck
      const pitchT = this.T_REL + 0.66 * (this.T_HIT - this.T_REL);
      const bf = t - pitchT;
      if (bf > 0 && bf < 0.35) {
        const w = this.ballAt(0.66);
        const sp = P(w.x, 0, w.z);
        if (sp) {
          // dust kicked off the deck
          const da = 1 - bf / 0.35;
          for (let di = 0; di < 3; di++) {
            const dr = (8 + di * 9) * (bf / 0.35 + 0.3) * Math.max(0.5, f * 0.02 / sp.d) * 8;
            ctx.fillStyle = 'rgba(190,172,135,' + (0.10 * da / (di + 1)) + ')';
            ctx.beginPath();
            ctx.ellipse(sp.x - di * dr * 0.15, sp.y - dr * 0.12, dr, dr * 0.38, 0, 0, 7);
            ctx.fill();
          }
        }
      }
    }
    if (ball) {
      // grounded contact shadow under the ball
      const gs = P(ball.x, 0, ball.z);
      const sp = P(ball.x, ball.y, ball.z);
      if (gs && sp) {
        const r = Math.max(3, f * 0.075 / sp.d);
        const shA = Math.max(0, 0.32 - ball.y * 0.12);
        ctx.fillStyle = 'rgba(0,0,0,' + shA + ')';
        ctx.beginPath(); ctx.ellipse(gs.x, gs.y, r * (1.15 - ball.y * 0.25), r * 0.32, 0, 0, 7); ctx.fill();
      }
      if (sp) {
        const r = Math.max(3, f * 0.075 / sp.d);
        // leather sphere: lit top-left by the floodlights
        const bg = ctx.createRadialGradient(sp.x - r * 0.38, sp.y - r * 0.42, r * 0.12, sp.x, sp.y, r * 1.05);
        bg.addColorStop(0, '#F0855A'); // tungsten highlight
        bg.addColorStop(0.45, '#B93A1E'); // rich leather
        bg.addColorStop(1, '#450E06'); // deep core shadow
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 7); ctx.fill();
        // stitched seam band, rotating with the ball
        ctx.save();
        ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 7); ctx.clip();
        ctx.translate(sp.x, sp.y); ctx.rotate((spin * 0.6) % (Math.PI * 2));
        ctx.strokeStyle = 'rgba(242,228,200,0.9)';
        ctx.lineWidth = Math.max(1, r * 0.055);
        ctx.beginPath(); ctx.ellipse(0, 0, r * 0.30, r * 0.97, 0, 0, 7); ctx.stroke();
        if (r > 10) {
          // stitches across the band
          ctx.lineWidth = Math.max(1, r * 0.035);
          ctx.strokeStyle = 'rgba(242,228,200,0.75)';
          for (let a = -0.75; a <= 0.75; a += 0.25) {
            const yy = a * r * 0.92;
            ctx.beginPath(); ctx.moveTo(-r * 0.10, yy); ctx.lineTo(r * 0.10, yy); ctx.stroke();
          }
        }
        ctx.restore();
        // rim light
        ctx.strokeStyle = 'rgba(255,240,220,0.35)';
        ctx.lineWidth = Math.max(1, r * 0.06);
        ctx.beginPath(); ctx.arc(sp.x, sp.y, r * 0.93, Math.PI * 0.95, Math.PI * 1.55); ctx.stroke();
      }
    }

    // ---- impact flash ----
    const fl = t - this.T_HIT;
    if (fl > 0 && fl < 0.09) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.16 * (1 - fl / 0.09)) + ')'; // brief exposure kick, not a cartoon flash
      ctx.fillRect(0, 0, W, H);
    }
    if (fl > 0 && fl < 0.5) {
      const sp = P(0, 0.45, 20.0);
      if (sp) {
        const a = 1 - fl / 0.5;
        const g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, 64);
        g.addColorStop(0, 'rgba(255,230,190,' + 0.30 * a + ')');
        g.addColorStop(1, 'rgba(255,230,190,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, 64, 0, 7); ctx.fill();
      }
    }
    // light-bloom match cut: the impact glow swells until it becomes the lockup screen
    const laB = this.ease((t - this.T_LOGO) / 0.8);
    if (fl > 0.10 && laB < 1) {
      const bp = P(0, 0.45, 20.0);
      if (bp) {
        const bloomK = this.easeIO((fl - 0.10) / (this.T_LOGO - this.T_HIT + 0.15));
        const R = 30 + bloomK * Math.hypot(W, H) * 1.05;
        const g = ctx.createRadialGradient(bp.x, bp.y, 0, bp.x, bp.y, R);
        g.addColorStop(0, 'rgba(247,245,238,' + Math.min(1, bloomK * 1.6) + ')');
        g.addColorStop(0.75, 'rgba(247,245,238,' + Math.min(1, bloomK * 1.25) * 0.85 + ')');
        g.addColorStop(1, 'rgba(247,245,238,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(bp.x, bp.y, R, 0, 7); ctx.fill();
      }
    }

    // ---- cinematic grade: vignette + letterbox + fade-in ----
    const laPre = this.ease((t - this.T_LOGO) / 0.8);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.72);
    vg.addColorStop(0, 'rgba(4,9,14,0)');
    vg.addColorStop(1, 'rgba(4,9,14,0.55)'); // teal-leaning corners
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    const barH = H * 0.08 * (1 - laPre);
    if (barH > 0.5) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, barH);
      ctx.fillRect(0, H - barH, W, barH);
    }
    // film grain
    if (this.noiseC && laPre < 1) {
      const ox = ((t * 6.1) % 1) * 128, oy = ((t * 4.7) % 1) * 128;
      ctx.save();
      ctx.globalAlpha = 0.55 * (1 - laPre);
      for (let gx = -ox; gx < W; gx += 128) for (let gy = -oy; gy < H; gy += 128) ctx.drawImage(this.noiseC, gx, gy);
      ctx.restore();
    }
    if (t < 0.4) {
      ctx.fillStyle = 'rgba(0,0,0,' + (1 - t / 0.4) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // ---- wordmark ----
    const la = this.ease((t - this.T_LOGO) / 0.8);
    if (la > 0) {
      ctx.save();
      ctx.globalAlpha = la;
      const bgL = ctx.createLinearGradient(0, 0, 0, H);
      bgL.addColorStop(0, '#F8F6EF');
      bgL.addColorStop(1, '#EDEAE0');
      ctx.fillStyle = bgL;
      ctx.fillRect(0, 0, W, H);
      // whisper of green at the frame edges
      const evg = ctx.createRadialGradient(W / 2, H * 0.46, H * 0.2, W / 2, H * 0.46, H * 0.8);
      evg.addColorStop(0, 'rgba(46,94,50,0)');
      evg.addColorStop(1, 'rgba(46,94,50,0.08)');
      ctx.fillStyle = evg;
      ctx.fillRect(0, 0, W, H);
      // zoom-in with a refined overshoot settle
      const zs = 0.72 + 0.28 * this.easeOutBack(la);
      ctx.translate(W / 2, H / 2); ctx.scale(zs, zs); ctx.translate(-W / 2, -H / 2);
      const cy = H * 0.44;
      // 1e pitch-mark logo: green rounded square, cream pitch, crease ticks
      const roundRect = (x, y, w2, h2, rad) => {
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w2, y, x + w2, y + h2, rad);
        ctx.arcTo(x + w2, y + h2, x, y + h2, rad);
        ctx.arcTo(x, y + h2, x, y, rad);
        ctx.arcTo(x, y, x + w2, y, rad);
        ctx.closePath();
      };
      const S = 84, lx = W / 2 - S / 2, ly = cy - 120;
      ctx.fillStyle = '#2E5E32';
      roundRect(lx, ly, S, S, 19); ctx.fill();
      ctx.fillStyle = '#D8C9A3';
      roundRect(W / 2 - 13, ly + 15, 26, 54, 7); ctx.fill();
      ctx.fillStyle = '#2E5E32';
      ctx.fillRect(W / 2 - 8, ly + 22, 16, 2.6);
      ctx.fillRect(W / 2 - 8, ly + 59.4, 16, 2.6);
      // name
      ctx.fillStyle = '#2E5E32';
      ctx.textAlign = 'center';
      ctx.font = '800 42px Archivo, sans-serif';
      ctx.fillText('cricrelay', W / 2, cy + 32);
      ctx.font = '500 16px "DM Sans", sans-serif';
      ctx.fillStyle = 'rgba(47,42,36,0.6)';
      ctx.fillText(this.props.tagline ?? "your club's home ground", W / 2, cy + 64);
      if (t > this.DUR - 0.6) {
        ctx.font = '500 13px "DM Sans", sans-serif';
        ctx.fillStyle = 'rgba(47,42,36,0.35)';
        ctx.fillText('tap to replay', W / 2, H - 36);
      }
      ctx.restore();
    }
  }

  renderVals() {
    return {
      androidRef: this.androidRef,
      iosRef: this.iosRef,
      replay: () => { this.t = 0; try { localStorage.setItem('cricrelay_splash1e_v2_t', '0'); } catch (e) {} },
    };
  }
}
</script>
