<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>BMACC Cricket Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }

  /* ── THEMES ── */
  :root {
    --bg:     rgba(5,10,22,0.93);
    --bg2:    rgba(3,6,14,0.97);
    --border: #1a3550;
    --accent: #4ade80;
    --acc2:   #93c5fd;
    --wicket: #f87171;
    --text:   #f1f5f9;
    --muted:  #64748b;
    --dim:    #253347;
    --extras: #fbbf24;
    --warn:   #fb923c;
    --crit:   #ef4444;
    --ok:     #4ade80;
  }
  .theme-green { --bg:rgba(3,14,7,.93);  --bg2:rgba(2,9,4,.97);   --border:#14532d; --accent:#4ade80; --acc2:#86efac;  --wicket:#fca5a5; }
  .theme-gold  { --bg:rgba(12,8,2,.93);  --bg2:rgba(8,5,1,.97);   --border:#78350f; --accent:#fbbf24; --acc2:#fde68a;  --wicket:#f87171; }
  .theme-red   { --bg:rgba(18,4,4,.93);  --bg2:rgba(12,2,2,.97);  --border:#7f1d1d; --accent:#f87171; --acc2:#fca5a5;  --wicket:#fbbf24; }

  /* ── OUTER FRAME ── */
  #overlay { position:fixed; bottom:0; left:0; right:0; display:flex; flex-direction:column; }

  #stale-bar { height:2px; background:transparent; transition:background 1s; }
  #stale-bar.stale { background:linear-gradient(90deg,transparent,#f59e0b,transparent);
    animation:stale-pulse 2s ease-in-out infinite; }

  /* ── STALE NOTICE TICKER ── */
  #stale-notice {
    height:0; overflow:hidden;
    background:rgba(180,90,0,0.18);
    border-bottom:1px solid rgba(245,158,11,0.25);
    transition:height .4s ease;
    display:flex; align-items:center;
    flex-shrink:0;
  }
  #stale-notice.visible { height:18px; }
  #ticker-outer { overflow:hidden; flex:1; height:18px; display:flex; align-items:center; }
  #ticker-inner {
    display:inline-block; white-space:nowrap;
    font-size:.57rem; font-weight:600; color:#f59e0b; letter-spacing:.04em;
    animation:ticker-run 40s linear infinite;
    will-change:transform;
  }
  #stale-notice-icon {
    flex-shrink:0; padding:0 8px; font-size:.62rem; color:#f59e0b;
    animation:stale-pulse 1.5s ease-in-out infinite;
  }

  #accent-line { height:3px;
    background:linear-gradient(90deg,transparent 0%,var(--accent) 12%,var(--accent) 88%,transparent 100%);
    filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 50%,transparent));
    opacity:.9; }

  #main-bar { flex-shrink:0; background:var(--bg); display:flex; align-items:stretch;
    border-top:1px solid var(--border); }

  /* ── LEFT: BATTING TEAM CORNER + BATSMEN ── */
  #left-block {
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    padding:0 14px; width:19.5rem; flex-shrink:0;
    background:var(--bg2); border-right:1px solid var(--border);
  }
  .team-corner { display:flex; align-items:center; gap:5px; min-width:0; }
  #right-block .team-corner { justify-content:flex-end; }
  .live-dot { width:5px; height:5px; border-radius:50%; background:#22c55e; flex-shrink:0;
    animation:live-blink 1.4s ease-in-out infinite; }
  .team-corner-label { font-size:.62rem; font-weight:800; color:var(--text); letter-spacing:.07em;
    text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }

  #bat-rows, #bowl-rows { display:flex; flex-direction:column; gap:3px; }
  #bowl-rows { align-items:flex-end; }
  .bat-row  { display:flex; align-items:baseline; gap:6px; }
  .bowl-row { display:flex; align-items:baseline; gap:6px; justify-content:flex-end; }
  .bat-star { color:var(--accent); font-size:.62rem; width:.7rem; flex-shrink:0; }
  .bat-name { font-size:.76rem; font-weight:700; color:var(--text); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .bat-name.ns { color:var(--muted); font-weight:600; }
  .bat-r  { font-size:.8rem; font-weight:900; color:var(--accent); flex-shrink:0; }
  .bat-r.ns { color:var(--muted); }
  .bat-b  { font-size:.6rem; color:var(--dim); flex-shrink:0; margin-left:1px; }

  /* ── CENTRE: SCORE ── */
  #centre-block { flex:1; position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; overflow:hidden; min-width:0; }
  #score-nums { display:flex; align-items:flex-end; gap:2px; line-height:1; }
  #score-runs { font-size:2.3rem; font-weight:900; color:var(--text); letter-spacing:-2px; line-height:1; }
  #score-wkts { font-size:1.4rem; font-weight:700; color:var(--acc2); line-height:1; padding-bottom:2px; }
  #score-overs { font-size:.62rem; color:var(--muted); font-weight:700; letter-spacing:.1em; text-transform:uppercase; }

  /* ── RIGHT: BOWLING TEAM CORNER + BOWLER ── */
  #right-block {
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    padding:0 14px; width:19.5rem; flex-shrink:0;
    background:var(--bg2); border-left:1px solid var(--border);
  }
  .bowl-name { font-size:.76rem; font-weight:700; color:var(--wicket); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .bowl-fig  { font-size:.8rem; font-weight:900; color:var(--text); flex-shrink:0; }

  #recent-over { display:flex; align-items:center; gap:3px; justify-content:flex-end; }

  /* Ball pills */
  .ball {
    width:1.05rem; height:1.05rem; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:.5rem; font-weight:800; line-height:1; flex-shrink:0;
  }
  .ball-ph  { width:1.05rem; height:1.05rem; border-radius:50%; background:rgba(20,32,55,.4); border:1px dashed var(--dim); flex-shrink:0; }
  .ball-dot { background:rgba(18,28,50,.9); color:var(--muted); border:1px solid var(--dim); }
  .ball-1   { background:rgba(28,48,80,.9); color:var(--acc2); border:1px solid rgba(147,197,253,.2); }
  .ball-2   { background:rgba(28,48,80,.9); color:var(--acc2); border:1px solid rgba(147,197,253,.2); }
  .ball-3   { background:rgba(28,48,80,.9); color:var(--acc2); border:1px solid rgba(147,197,253,.2); }
  .ball-4   { background:rgba(20,45,120,.9); color:#93c5fd; border:1px solid rgba(96,165,250,.35); }
  .ball-6   { background:rgba(110,48,5,.9);  color:#fde68a; border:1px solid rgba(251,191,36,.3); }
  .ball-W   { background:rgba(120,18,18,.9); color:#fca5a5; border:1px solid rgba(248,113,113,.35); animation:ball-wkt 1.6s ease-in-out infinite; }
  .ball-Wd  { background:rgba(60,28,4,.9);   color:#fb923c; border:1px solid rgba(251,146,60,.3); font-size:.44rem; }
  .ball-NB  { background:rgba(60,28,4,.9);   color:#fb923c; border:1px solid rgba(251,146,60,.3); font-size:.41rem; }

  #inn-label { font-size:.5rem; color:var(--dim); letter-spacing:.06em; text-align:right; margin-top:1px; }

  /* ── BOTTOM STRIP: TARGET / CRR / REQUIRED RR (or LAST WKT) ── */
  #bottom-strip { height:22px; flex-shrink:0; background:var(--bg2); border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; gap:16px; }
  .bstrip-seg { display:flex; align-items:baseline; gap:5px; }
  .bstrip-seg.hidden { display:none; }
  .bstrip-lbl { font-size:.52rem; font-weight:700; color:var(--muted); letter-spacing:.09em; text-transform:uppercase; }
  .bstrip-val { font-size:.68rem; font-weight:800; color:var(--text); }
  .bstrip-val.ok   { color:var(--ok);   }
  .bstrip-val.warn { color:var(--warn); }
  .bstrip-val.crit { color:var(--crit); animation:crit-flash 1.2s ease-in-out infinite; }
  .bstrip-div { width:1px; height:11px; background:var(--dim); flex-shrink:0; }

  /* ── OVERLAY PANELS (absolute, cover main-bar + bottom-strip) ── */
  .panel {
    position:absolute; left:0; right:0; bottom:0; height:100px;
    display:flex; align-items:center; padding:0 14px;
    opacity:0; transform:translateY(7px);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none; z-index:5;
  }
  .panel.active { opacity:1; transform:translateY(0); pointer-events:auto; }

  /* Result panel — covers full bar, shown when match is complete */
  #panel-result { flex-direction:column; justify-content:center; gap:5px; background:var(--bg2); padding:0 14px; border-top:2px solid var(--accent); }
  #res-row1 { display:flex; align-items:center; gap:10px; }
  #res-winner { font-size:.92rem; font-weight:900; color:var(--accent); letter-spacing:.04em; }
  #res-margin { font-size:.62rem; font-weight:600; color:var(--muted); letter-spacing:.04em; padding-left:3px; }
  #res-scores { font-size:.55rem; color:var(--dim); letter-spacing:.04em; }

  /* Wicket */
  #panel-wicket { gap:8px; background:rgba(12,3,3,.97); border-top:2px solid rgba(239,68,68,.25); }
  .wkt-tag  { font-size:.56rem; font-weight:800; color:var(--wicket); letter-spacing:.14em; text-transform:uppercase;
    padding:2px 7px; border:1px solid var(--wicket); border-radius:3px; flex-shrink:0;
    animation:wicket-pulse 1.2s ease-in-out infinite; }
  .wkt-txt  { font-size:.82rem; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .wkt-bar  { position:absolute; bottom:0; left:0; height:2px; background:var(--wicket); transition:width 1s linear; }

  /* Extras */
  #panel-extras { background:var(--bg); }
  .ext-tag { font-size:.58rem; font-weight:700; color:var(--extras); letter-spacing:.1em; text-transform:uppercase; flex-shrink:0; }
  .ext-val { font-size:.82rem; color:var(--text); margin-left:8px; }
  .ext-sub { font-size:.63rem; color:var(--muted); margin-left:6px; }

  /* ── PRE-MATCH PANEL ── */
  #panel-prematch { flex-direction:column; justify-content:center; gap:3px;
    background:var(--bg2); padding:0 14px; border-top:none; }
  #pm-row1 { display:flex; align-items:center; gap:8px; }
  #pm-comp { font-size:.56rem; color:var(--muted); letter-spacing:.07em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  #pm-date { font-size:.56rem; color:var(--acc2); font-weight:600; flex-shrink:0; }
  #pm-countdown { font-size:.56rem; color:var(--acc2); font-weight:700; flex-shrink:0; margin-left:8px; }
  #pm-row2 { display:flex; align-items:center; gap:8px; }
  #pm-teams { font-size:.82rem; font-weight:700; color:var(--text); white-space:nowrap;
    flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #pm-vs-sep { font-size:.60rem; color:var(--dim); margin:0 3px; }
  #pm-toss { font-size:.60rem; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:8px; }
  #pm-format { font-size:.56rem; color:var(--acc2); font-weight:600; flex-shrink:0; padding:1px 6px; border:1px solid rgba(147,197,253,.2); border-radius:3px; }

  /* ── KEYFRAMES ── */
  @keyframes live-blink   { 0%,100%{opacity:1;box-shadow:0 0 4px #22c55e} 50%{opacity:.3;box-shadow:none} }
  @keyframes wicket-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes stale-pulse  { 0%,100%{opacity:.4} 50%{opacity:1} }
  @keyframes crit-flash   { 0%,100%{opacity:1} 50%{opacity:.6} }
  @keyframes ball-wkt     { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
  /* Seamless ticker: text is doubled, so -50% = one full copy scrolled off left */
  @keyframes ticker-run   { from{transform:translateX(0)} to{transform:translateX(-50%)} }

  #sponsor-root {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }
  /* ── SPONSOR LOGO (web/OBS overlay — mobile app composites natively) ── */
  #sponsor-wrap {
    position: fixed;
    left: 0;
    right: 0;
    pointer-events: none;
    z-index: 100;
    display: none;
    overflow: hidden;
  }
  #sponsor-wrap.mode-static {
    overflow: visible;
    left: auto;
    right: auto;
    top: auto;
    bottom: auto;
  }
  #sponsor-logo {
    max-height: 72px;
    max-width: 28vw;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    opacity: 1;
  }
  #sponsor-wrap.scroll-band {
    height: 56px;
    display: flex;
    align-items: center;
  }
  #sponsor-wrap.scroll-band #sponsor-logo {
    position: relative;
    max-height: 48px;
    animation: sponsor-scroll linear infinite;
  }
  @keyframes sponsor-scroll {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-120%); }
  }

  /* ── Barlow broadcast scoreboard (default layout) ── */
  body.board-barlow {
    --sb-navy: #16294d;
    --sb-panel: #eef0f3;
    --sb-panel-line: #d7dbe1;
    --sb-gold: #d4a017;
    --sb-ink: #16294d;
    --sb-muted: #6a7180;
    --sb-navy-muted: #8f9bb3;
    --sb-dot-dark: #16294d;
    --sb-dot-zero-bg: #c9ced6;
    --sb-dot-zero-fg: #4a5163;
    --sb-dot-wicket: #c0392b;
    font-family: 'Barlow', sans-serif;
  }
  #sb-root { display: none; }
  body.board-barlow #sb-root { display: block; }
  body.board-barlow #accent-line,
  body.board-barlow #main-bar,
  body.board-barlow #bottom-strip { display: none !important; }
  body.board-barlow .sb-wrap {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 12px 10px;
    box-sizing: border-box;
  }
  body.board-barlow .sb-bar {
    display: flex;
    height: 76px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
  }
  body.board-barlow .sb-navy { background: var(--sb-navy); }
  body.board-barlow .sb-panel { background: var(--sb-panel); }
  body.board-barlow .sb-team {
    flex: none;
    width: 214px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px 0 18px;
  }
  body.board-barlow .sb-team--right { justify-content: flex-end; padding: 0 18px 0 20px; gap: 12px; }
  body.board-barlow .sb-crest {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    color: #e8ecf3; flex: none;
  }
  body.board-barlow .sb-team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; color: #fff;
    line-height: .98; font-size: 22px; letter-spacing: .3px;
  }
  body.board-barlow .sb-bat {
    position: relative; flex: 1; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 8px 20px 12px;
  }
  body.board-barlow .sb-bat::after {
    content: ""; position: absolute; left: 0; bottom: 0;
    width: 100%; height: 4px; background: var(--sb-gold);
  }
  body.board-barlow .sb-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0;
  }
  body.board-barlow .sb-name {
    display: flex; align-items: center; gap: 7px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 19px; color: var(--sb-ink); letter-spacing: .3px;
  }
  body.board-barlow .sb-strike { width: 9px; height: 10px; fill: var(--sb-ink); flex-shrink: 0; }
  body.board-barlow .sb-fig { font-family: 'Barlow Condensed', sans-serif; color: var(--sb-ink); white-space: nowrap; }
  body.board-barlow .sb-fig b { font-size: 20px; }
  body.board-barlow .sb-fig span { font-size: 15px; color: var(--sb-muted); }
  body.board-barlow .sb-div { height: 1px; background: var(--sb-panel-line); }
  body.board-barlow .sb-score {
    flex: none; width: 240px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 24px;
  }
  body.board-barlow .sb-runs {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; color: #fff; font-size: 44px; line-height: .9; letter-spacing: .5px;
  }
  body.board-barlow .sb-overs { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
  body.board-barlow .sb-overs b { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: #fff; font-size: 19px; }
  body.board-barlow .sb-overs span { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; color: var(--sb-navy-muted); font-size: 14px; letter-spacing: 1px; }
  body.board-barlow .sb-bowl {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
    padding: 8px 22px;
  }
  body.board-barlow .sb-bowl-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  body.board-barlow .sb-dots { display: flex; gap: 7px; flex-wrap: nowrap; }
  body.board-barlow .sb-dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px;
    background: var(--sb-dot-dark); color: #fff;
  }
  body.board-barlow .sb-dot--ph { background: transparent; border: 1px dashed var(--sb-dot-zero-bg); color: var(--sb-dot-zero-fg); opacity: .5; }
  body.board-barlow .sb-dot--zero { background: var(--sb-dot-zero-bg); color: var(--sb-dot-zero-fg); }
  body.board-barlow .sb-dot--wicket { background: var(--sb-dot-wicket); color: #fff; }
  body.board-barlow .sb-stats { display: flex; margin-top: 6px; gap: 6px; }
  body.board-barlow .sb-stat {
    flex: 1; height: 34px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--sb-panel);
  }
  body.board-barlow .sb-stat--dark { background: var(--sb-navy); }
  body.board-barlow .sb-stat .k {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px;
    color: var(--sb-muted); letter-spacing: 1px;
  }
  body.board-barlow .sb-stat .v {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--sb-ink);
  }
  body.board-barlow .sb-stat--dark .k { color: var(--sb-navy-muted); }
  body.board-barlow .sb-stat--dark .v { color: #fff; }
  body.board-barlow .sb-stat.hidden { display: none; }

  /* Play-Cricket data pattern — delayed end-of-over snapshot, not live ball-by-ball */
  body.play-cricket-data.board-barlow .sb-crest { display: none; }
  body.play-cricket-data.board-barlow .sb-team {
    width: auto;
    min-width: 120px;
    max-width: 220px;
    flex: none;
  }
  body.play-cricket-data.board-barlow .sb-strike { display: none; }
  body.play-cricket-data .bat-star { visibility: hidden; width: 0; margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="overlay">
  <div id="stale-bar"></div>
  <div id="stale-notice">
    <span id="stale-notice-icon">⚠</span>
    <div id="ticker-outer">
      <div id="ticker-inner"><!-- populated by JS --></div>
    </div>
  </div>
  <div id="accent-line"></div>
  <div id="main-bar" style="height:78px">

    <!-- LEFT: batting team corner + batsmen -->
    <div id="left-block">
      <div class="team-corner">
        <span class="live-dot" id="live-dot-left"></span>
        <span class="team-corner-label" id="team-corner-left">—</span>
      </div>
      <div id="bat-rows">
        <div class="bat-row">
          <span class="bat-star">★</span>
          <span class="bat-name" id="striker-name">—</span>
          <span class="bat-r" id="striker-runs">—</span>
          <span class="bat-b" id="striker-balls">(—)</span>
        </div>
        <div class="bat-row">
          <span class="bat-star" style="visibility:hidden">★</span>
          <span class="bat-name ns" id="nonstriker-name">—</span>
          <span class="bat-r ns" id="nonstriker-runs">—</span>
          <span class="bat-b" id="nonstriker-balls">(—)</span>
        </div>
      </div>
    </div>

    <!-- CENTRE: score -->
    <div id="centre-block">
      <div id="score-nums">
        <span id="score-runs">—</span>
        <span id="score-wkts">/—</span>
      </div>
      <div id="score-overs">— OVERS</div>

      <!-- Overlay panels (sit above centre+left+right+bottom-strip when active) -->

      <!-- PRE-MATCH -->
      <div class="panel" id="panel-prematch">
        <div id="pm-row1">
          <span id="pm-comp">—</span>
          <span id="pm-date">—</span>
          <span id="pm-countdown">—</span>
        </div>

    <div id="right-block">

  <!-- BOTTOM STRIP: target / crr / required-rr (2nd innings) or crr / last-wicket (1st innings) -->

              <circle cx="24" cy="26" r="9"/>
              <path d="M24 17v18M15 26h18" stroke-width="1.2"/>

        <div class="sb-stat" id="sb-stat-rrr"><span class="k" id="sb-stat-rrr-lbl">REQUIRED RR:</span><span class="v" id="sb-rrr">—</span></div>
      </div>

  </div>

</div>
<div id="sponsor-root"></div>

<script>
// ══════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════
// Derive API URL from path when served at /m/<slug>/stream or legacy /stream
const _pathMatch = window.location.pathname.match(/\/m\/([^/]+)\/stream/)
                || (window.location.pathname === '/stream' ? ['', 'default'] : null);
const _pathApiUrl = _pathMatch ? '/m/' + _pathMatch[1] + '/overlay-data' : null;

const CFG = {
  apiUrl:           window.API_URL
                  || new URLSearchParams(location.search).get('apiUrl')
                  || _pathApiUrl
                  || '/score',
  pollMs:           15000,   // 15s — ResultsVault scraper runs every 20s, so ≤35s total lag
  wicketDurMs:      240000,
  wicketCycleMs:    30000,
  extrasDurMs:      6000,
  extrasMilestone:  5,
  // Amber pulse line after 5 min (one over worth of expected delay)
  staleAfterMs:     300000,
  // Scrolling viewer notice after 8 min (hotspot/PCS dropout scenario)
  noticeAfterMs:    480000,
  theme: new URLSearchParams(location.search).get('theme') || 'navy',
};
const THEMES = { navy:'', green:'theme-green', gold:'theme-gold', red:'theme-red' };
document.getElementById('overlay').className = THEMES[CFG.theme] || '';

function applyBoardStyle() {
  document.body.classList.add('board-barlow');
}
applyBoardStyle();
window.applyBoardStyle = applyBoardStyle;

// ══════════════════════════════════════════════════════════
// SCALE-TO-FIT  (broadcast overlay — design width 1280px; scales down on phones that
// encode below 1280p or in portrait so text stays proportional to the stream frame)
// ══════════════════════════════════════════════════════════
const DESIGN_W = 1280;
function applyOverlayScale() {
  const el = document.getElementById('overlay');
  if (!el) return;
  const vw = window.innerWidth || document.documentElement.clientWidth || DESIGN_W;
  if (vw <= 0 || vw >= DESIGN_W) {
    // At or above design width — spans full width naturally, no scaling needed
    el.style.transform = '';
    el.style.width = '';
    el.style.right = '0';
  } else {
    // Below design width — scale down proportionally so nothing is cropped
    const s = vw / DESIGN_W;
    el.style.width = DESIGN_W + 'px';
    el.style.right = 'auto';
    el.style.transformOrigin = 'bottom left';
    el.style.transform = 'scale(' + s + ')';
  }
}
applyOverlayScale();
window.addEventListener('resize', applyOverlayScale);

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const S = {
  prevWickets:   null,
  isWicket:      false,
  wicketTimer:   null,
  wicketCycle:   null,
  staleTimer:    null,
  noticeTimer:   null,
  noticeRefresh: null,
  noticeActive:  false,
  lastOversInt:  -1,
  lastData:      null,
  lastFetchedAt: null,  // epoch ms of last successful poll
};

// ══════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════
function shortName(name) {
  if (!name) return '—';
  const p = name.trim().split(/\s+/);
  return p.length === 1 ? name : p[0][0] + ' ' + p.slice(1).join(' ');
}

function toCode(name) {
  if (!name) return '—';
  return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase();
}

function crr(runs, overs) {
  const [o, b=0] = String(overs).split('.').map(Number);
  const t = o + b/6;
  return t > 0 ? (runs/t).toFixed(2) : '0.00';
}

function oversInt(overs) { return parseInt(String(overs).split('.')[0], 10); }

function ordinal(n) {
  n = parseInt(n, 10);
  if (!n || n < 1) return '—';
  const v = n % 100;
  const suffix = (v >= 11 && v <= 13) ? 'th' : ['th','st','nd','rd'][n % 10] || 'th';
  return n + suffix;
}

/** Play-Cricket: whole overs completed — "18th over up", "3 overs up". */
function formatInningsOverUp(overs) {
  const n = oversInt(overs);
  if (!n || n < 1) return '—';
  return ordinal(n).toUpperCase() + ' OVER UP';
}

function formatBowlerOversUp(overs) {
  const n = oversInt(overs);
  if (!n || n < 1) return '—';
  return n + (n === 1 ? ' over up' : ' overs up');
}

function isPlayCricketSource(data) {
  const q = new URLSearchParams(location.search).get('source');
  if (q === 'play_cricket' || q === 'play-cricket') return true;
  if (q === 'cricheroes') return false;
  const pattern = String((data && data.data_pattern) || '').toLowerCase();
  if (pattern === 'play_cricket') return true;
  if (pattern === 'cricheroes') return false;
  const src = String((data && data.relay_source) || '').toLowerCase();
  const mode = String((data && data.relay_mode) || '').toLowerCase();
  return src === 'scraper' || mode === 'play_cricket' || src === 'pcs_ble' || mode === 'pcs_ble';
}

function applyDataPatternClass(data) {
  const pc = isPlayCricketSource(data);
  document.body.classList.toggle('play-cricket-data', pc);
  document.body.classList.toggle('cricheroes-data', !pc && (
    (data && data.data_pattern === 'cricheroes') ||
    (data && data.relay_source === 'cricheroes') ||
    new URLSearchParams(location.search).get('source') === 'cricheroes'
  ));
}

function ballsLeft(totalOvers, currentOvers) {
  const [o, b=0] = String(currentOvers).split('.').map(Number);
  return totalOvers * 6 - (o * 6 + b);
}

function rrr(runsNeeded, balls) {
  return balls > 0 ? ((runsNeeded / balls) * 6).toFixed(2) : '∞';
}

function bowlingTeamName(data, inn) {
  const batting = (inn.batting_team || data.batting_team || data.home_team || '').trim();
  const home = (data.home_team || '').trim();
  const away = (data.away_team || '').trim();
  if (home && batting === home) return data.away_team || '—';
  if (away && batting === away) return data.home_team || '—';
  return data.away_team || data.home_team || '—';
}

function lastWicketText(inn) {
  const batters = (inn && inn.batters) || [];
  const out = batters.filter(b => b.status === 'out');
  if (!out.length) return '—';
  const b = out[out.length - 1];
  return shortName(b.name) + ' ' + (b.runs != null ? b.runs : 0) + '(' + (b.balls != null ? b.balls : 0) + ')';
}

// ══════════════════════════════════════════════════════════
// MATCH TIME + PRE-MATCH HELPERS
// ══════════════════════════════════════════════════════════
const MONTH_IDX = {January:0,February:1,March:2,April:3,May:4,June:5,
  July:6,August:7,September:8,October:9,November:10,December:11};

function getMatchStartTime(data) {
  // data.match.date = "27 June 2026 @ 13:00"  (BST = UTC+1 in summer)
  try {
    const raw = data && data.match && data.match.date;
    if (!raw) return null;
    const m = raw.match(/(\d{1,2})\s+(\w+)\s+(\d{4})\s+@\s+(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const [, day, mon, year, hour, min] = m;
    if (MONTH_IDX[mon] === undefined) return null;
    // BST = UTC+1: subtract 1h to get UTC
    const utc = Date.UTC(+year, MONTH_IDX[mon], +day, +hour - 1, +min);
    return new Date(utc);
  } catch(e) { return null; }
}

function hasMatchStarted(data) {
  if (!data) return false;
  const status = ((data.match && data.match.status) || '').toUpperCase();
  if (status === 'IN PROGRESS' || status.includes('COMPLETE')) return true;
  if (status === 'NOT STARTED') return false;
  if (data.innings && data.innings.length > 0) return true;
  const t = getMatchStartTime(data);
  return t ? Date.now() >= t.getTime() : true;
}

function isPreMatch(data) {
  if (!data) return true;
  if (data.innings && data.innings.length > 0) return false;
  const status = ((data.match && data.match.status) || '').toUpperCase();
  if (status === 'IN PROGRESS' || status.includes('COMPLETE')) return false;
  return true;
}

function countdownLabel(startTime) {
  if (!startTime) return '';
  const diffMs = startTime.getTime() - Date.now();
  if (diffMs <= 0) return 'Starting soon';
  const totalMin = Math.floor(diffMs / 60000);
  if (totalMin < 1) return 'Starting now';
  if (totalMin < 60) return 'Starts in ' + totalMin + 'm';
  const h = Math.floor(totalMin / 60), mins = totalMin % 60;
  return 'Starts in ' + h + 'h' + (mins ? ' ' + mins + 'm' : '');
}

// No delay-type detection — we never speculate about the cause.
// One honest generic message covers rain, hotspot, PCS, anything else.

// ══════════════════════════════════════════════════════════
// STALE NOTICE TICKER
// ══════════════════════════════════════════════════════════
function formatTime(isoStr) {
  if (!isoStr) return '—';
  try {
    // ISO string e.g. "2026-06-27T13:04:49" — parse as local time
    const d = new Date(isoStr.replace(' ', 'T'));
    return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  } catch(e) { return isoStr.slice(11, 16) || '—'; }
}

function buildTickerMsg(data) {
  const inn      = data && data.innings && (data.innings[1] || data.innings[0]);
  const lastTime = data && data.last_updated ? formatTime(data.last_updated) : '—';
  const overs    = inn ? inn.overs : '—';
  const score    = inn ? inn.runs + '/' + inn.wickets : '—';
  const team     = inn ? toCode(inn.batting_team || data.batting_team || '') : '—';
  const minAgo   = S.lastFetchedAt ? Math.floor((Date.now() - S.lastFetchedAt) / 60000) : '?';

  // One honest generic message — never speculates about cause
  const msg = `  ⚠  Score not updating  ·  Last known: ${team} ${score} (${overs} ov) at ${lastTime}  ·  ${minAgo} min ago  ·  Please ask the on-field scorer to sync Play Cricket  ·  `;
  return msg + msg; // doubled for seamless CSS loop
}

function showStaleNotice(data) {
  if (S.noticeActive) {
    // Refresh the message text if already visible (e.g. minAgo increased)
    document.getElementById('ticker-inner').textContent = buildTickerMsg(data);
    return;
  }
  S.noticeActive = true;
  const msg = buildTickerMsg(data);
  const el  = document.getElementById('ticker-inner');
  el.textContent = msg;
  // Scale animation speed to text length (~80px/s feels right for tickers)
  const charWidth  = 6.5; // px per char at .57rem on Segoe UI
  const halfWidth  = (msg.length / 2) * charWidth;
  const durationMs = Math.max(20000, halfWidth / 80 * 1000);
  el.style.animationDuration = (durationMs / 1000).toFixed(1) + 's';
  document.getElementById('stale-notice').classList.add('visible');
}

function hideStaleNotice() {
  if (!S.noticeActive) return;
  S.noticeActive = false;
  document.getElementById('stale-notice').classList.remove('visible');
}

// ══════════════════════════════════════════════════════════
// RECENT OVER BALLS
// ══════════════════════════════════════════════════════════
function ballClass(d) {
  const key = String(d).trim();
  if (key === '.' || key === '0') return 'ball ball-dot';
  if (key === 'W')  return 'ball ball-W';
  if (key === '4')  return 'ball ball-4';
  if (key === '6')  return 'ball ball-6';
  if (key === 'Wd' || key === 'WD' || key === 'wd') return 'ball ball-Wd';
  if (key === 'NB' || key === 'nb') return 'ball ball-NB';
  if (key === '1') return 'ball ball-1';
  if (key === '2') return 'ball ball-2';
  if (key === '3') return 'ball ball-3';
  return 'ball ball-1';
}

function ballLabel(d) {
  const key = String(d).trim();
  if (key === '.' || key === '0') return '·';
  if (key === 'Wd' || key === 'WD' || key === 'wd') return 'Wd';
  return key;
}

function renderRecentOver(balls) {
  const c = document.getElementById('balls-container');
  if (!balls || !balls.length) {
    c.innerHTML = Array(6).fill('<div class="ball-ph"></div>').join('');
    return;
  }
  const shown = balls.slice(-6);
  let html = '';
  for (let i = 0; i < 6; i++) {
    if (i < shown.length) {
      html += `<div class="${ballClass(shown[i])}">${ballLabel(shown[i])}</div>`;
    } else {
      html += '<div class="ball-ph"></div>';
    }
  }
  c.innerHTML = html;
}

// ══════════════════════════════════════════════════════════
// RESULT HELPERS
// ══════════════════════════════════════════════════════════
function isMatchComplete(data) {
  const status = ((data.match && data.match.status) || '').toUpperCase();
  if (status.includes('WON') || status.includes('TIED') || status.includes('ABANDONED')) return true;
  const inn2 = data.innings && data.innings[1];
  if (!inn2) return false;
  if (inn2.wickets >= 10) return true;
  const target = data.target || (data.innings[0] && data.innings[0].runs + 1);
  if (target && inn2.runs >= target) return true;
  return false;
}

function renderResultPanel(data) {
  const inn1 = data.innings && data.innings[0];
  const inn2 = data.innings && data.innings[1];
  if (!inn1 || !inn2) return;

  const target  = data.target || (inn1.runs + 1);
  const needed  = target - inn2.runs;
  const batting = toCode(inn2.batting_team || data.batting_team || '');
  const bowling = toCode(inn1.batting_team || data.home_team || '');

  let winner, margin;
  if (inn2.runs >= target) {
    const wktsLeft = 10 - inn2.wickets;
    winner = batting + ' WON';
    margin = 'by ' + wktsLeft + ' wicket' + (wktsLeft !== 1 ? 's' : '');
  } else {
    winner = bowling + ' WON';
    margin = 'by ' + (needed - 1) + ' run' + (needed - 1 !== 1 ? 's' : '');
  }

  const inn2wkts = inn2.wickets >= 10 ? 'all out' : '/' + inn2.wickets;
  const scores = bowling + ' ' + inn1.runs + '/' + inn1.wickets + ' (' + inn1.overs + ' ov)'
               + '   vs   '
               + batting + ' ' + inn2.runs + ' ' + inn2wkts + ' (' + inn2.overs + ' ov)';

  document.getElementById('res-winner').textContent = winner;
  document.getElementById('res-margin').textContent = margin;
  document.getElementById('res-scores').textContent = scores;
}

// ══════════════════════════════════════════════════════════
// PRE-MATCH RENDER
// ══════════════════════════════════════════════════════════
let countdownInterval = null;

function renderPreMatch(data) {
  const m = data.match || {};
  const startTime = getMatchStartTime(data);

  document.getElementById('live-dot-left').style.display = 'none';
  document.getElementById('team-corner-left').textContent  = data.home_team || '—';
  document.getElementById('team-corner-right').textContent = data.away_team || '—';
  document.getElementById('inn-label').textContent = 'Match Day';

  document.getElementById('pm-comp').textContent = m.competition || '—';
  document.getElementById('pm-date').textContent = m.date || '—';

  const home = data.home_team || '—';
  const away = data.away_team || '—';
  document.getElementById('pm-teams').innerHTML =
    `${home} <span id="pm-vs-sep" style="color:var(--dim);font-size:.6rem;margin:0 4px">vs</span> ${away}`;

  document.getElementById('pm-toss').textContent = m.toss || 'Toss not yet taken';
  document.getElementById('pm-format').textContent =
    data.total_overs ? data.total_overs + '-over match' : 'Limited overs';

  // Countdown label — updates every 30s
  function updateCountdown() {
    document.getElementById('pm-countdown').textContent = countdownLabel(startTime);
  }
  updateCountdown();
  clearInterval(countdownInterval);
  if (startTime) countdownInterval = setInterval(updateCountdown, 30000);

  showPanel('prematch');
}

// ══════════════════════════════════════════════════════════
// SPONSOR (web/OBS overlay — mobile app composites sponsor natively on the GL layer)
// ══════════════════════════════════════════════════════════
let sponsorCarouselTimer = null;

function clearSponsorOverlay() {
  if (sponsorCarouselTimer) {
    clearInterval(sponsorCarouselTimer);
    sponsorCarouselTimer = null;
  }
  const root = document.getElementById('sponsor-root');
  if (root) root.innerHTML = '';
}

function sponsorLogoEntries(sponsor) {
  if (!sponsor) return [];
  if (Array.isArray(sponsor.logos) && sponsor.logos.length) {
    return sponsor.logos.filter(function (e) { return e && e.logo_url; });
  }
  if (sponsor.logo_url) {
    return [{ logo_url: sponsor.logo_url, name: sponsor.name || '' }];
  }
  return [];
}

function applySponsorStyle(img, sponsor, scale, opacity) {
  img.style.opacity = String(opacity);
  img.style.maxHeight = (48 * scale) + 'px';
  img.style.maxWidth = (140 * scale) + 'px';
  img.style.width = 'auto';
  img.style.height = 'auto';
  img.style.objectFit = 'contain';
  img.style.display = 'block';
}

function applySponsorScrollBand(wrap, sponsor, speed) {
  wrap.className = 'scroll-band';
  wrap.style.cssText = 'display:flex;position:fixed;left:0;right:0;pointer-events:none;z-index:100;overflow:hidden;';
  const mode = String(sponsor.display_mode || 'static').toLowerCase();
  const durationSec = (22 / speed).toFixed(1);
  const overlayEl = document.getElementById('overlay');
  const overlayH = overlayEl ? overlayEl.offsetHeight : Math.round(window.innerHeight * 0.16);
  if (mode === 'scroll_top') {
    wrap.style.top = '8px'; wrap.style.bottom = 'auto';
  } else if (mode === 'scroll_bottom') {
    wrap.style.top = 'auto'; wrap.style.bottom = '8px';
  } else if (mode === 'scroll_above_board') {
    wrap.style.top = 'auto'; wrap.style.bottom = (overlayH + 8) + 'px';
  } else if (mode === 'scroll_below_board') {
    wrap.style.top = 'auto'; wrap.style.bottom = Math.max(8, Math.round(overlayH * 0.4)) + 'px';
  } else {
    wrap.style.top = '8px'; wrap.style.bottom = 'auto';
  }
  wrap.querySelectorAll('img').forEach(function (img) {
    img.style.animation = 'sponsor-scroll ' + durationSec + 's linear infinite';
  });
}

function applySponsorStatic(imgWrap, px, py) {
  imgWrap.className = 'mode-static';
  imgWrap.style.cssText = 'position:fixed;pointer-events:none;z-index:100;display:block;';
  imgWrap.style.left = (px * 100) + '%';
  imgWrap.style.top = (py * 100) + '%';
  imgWrap.style.transform = 'translate(-50%, -50%)';
}

function renderSponsorSet(sponsor, entries) {
  const root = document.getElementById('sponsor-root');
  if (!root) return;
  root.innerHTML = '';
  const scale = Math.max(0.3, Math.min(3, Number(sponsor.size_scale) || 1));
  const opacity = Math.max(0.2, Math.min(1, Number(sponsor.opacity ?? 1)));
  const speed = Math.max(0.3, Math.min(3, Number(sponsor.scroll_speed) || 1));
  const px = Math.max(0, Math.min(1, Number(sponsor.position_x ?? 0.92)));
  const py = Math.max(0, Math.min(1, Number(sponsor.position_y ?? 0.88)));
  const mode = String(sponsor.display_mode || 'static').toLowerCase();
  const scroll = mode !== 'static';

  if (scroll) {
    const band = document.createElement('div');
    band.id = 'sponsor-wrap';
    entries.forEach(function (entry, i) {
      const img = document.createElement('img');
      img.alt = entry.name || '';
      img.src = entry.logo_url;
      applySponsorStyle(img, sponsor, scale * (entries.length > 2 ? 0.7 : entries.length > 1 ? 0.85 : 1), opacity);
      img.style.marginRight = '24px';
      band.appendChild(img);
    });
    root.appendChild(band);
    applySponsorScrollBand(band, sponsor, speed);
    return;
  }

  entries.forEach(function (entry, i) {
    const wrap = document.createElement('div');
    const img = document.createElement('img');
    img.alt = entry.name || '';
    img.src = entry.logo_url;
    const sizeMul = entries.length > 2 ? 0.7 : entries.length > 1 ? 0.85 : 1;
    applySponsorStyle(img, sponsor, scale * sizeMul, opacity);
    wrap.appendChild(img);
    const cx = entries.length <= 1 ? px : (i + 0.5) / entries.length;
    applySponsorStatic(wrap, cx, py);
    root.appendChild(wrap);
  });
}

function applySponsor(sponsor) {
  clearSponsorOverlay();
  const entries = sponsorLogoEntries(sponsor);
  if (!entries.length) return;

  const layoutMode = String(sponsor.layout_mode || 'single').toLowerCase();
  if (layoutMode === 'carousel' && entries.length > 1) {
    let idx = 0;
    const intervalMs = Math.max(2000, Math.min(30000, Number(sponsor.carousel_interval_sec || 6) * 1000));
    const show = function () {
      renderSponsorSet(sponsor, [entries[idx % entries.length]]);
      idx += 1;
    };
    show();
    sponsorCarouselTimer = setInterval(show, intervalMs);
    return;
  }

  const showAll = layoutMode === 'multi' ? entries.slice(0, 6) : [entries[0]];
  renderSponsorSet(sponsor, showAll);
}

// ══════════════════════════════════════════════════════════
// BARLOW LAYOUT (boardStyle=barlow)
// ══════════════════════════════════════════════════════════
function isBarlowLayout() { return true; }

function barlowName(name) {
  if (!name) return '—';
  const p = name.trim().split(/\s+/);
  if (p.length === 1) return p[0].toUpperCase();
  return (p[0][0] + '. ' + p.slice(1).join(' ')).toUpperCase();
}

function formatBarlowTeam(name) {
  if (!name || name === '—') return '—';
  const parts = name.trim().split(/\s+/);
  if (parts.length <= 2) return parts.join(' ').toUpperCase();
  const mid = Math.ceil(parts.length / 2);
  return parts.slice(0, mid).join(' ').toUpperCase() + '<br>' + parts.slice(mid).join(' ').toUpperCase();
}

function renderBarlowOver(balls, playCricket) {
  const wrap = document.getElementById('sb-dots');
  if (!wrap) return;
  const shown = (balls && balls.length) ? balls.slice(-6) : [];
  wrap.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('span');
    if (i < shown.length) {
      const raw = String(shown[i]).trim();
      const isDot = raw === '.' || raw === '0';
      const isW = raw.toUpperCase() === 'W';
      s.className = 'sb-dot' + (isW ? ' sb-dot--wicket' : isDot ? ' sb-dot--zero' : '');
      s.textContent = isDot ? '0' : (raw === 'Wd' || raw === 'WD' || raw === 'wd' ? 'Wd' : raw);
    } else if (playCricket) {
      s.className = 'sb-dot sb-dot--ph';
      s.textContent = '·';
    } else {
      s.className = 'sb-dot sb-dot--ph';
      s.textContent = '·';
    }
    wrap.appendChild(s);
  }
}

function renderBarlow(data, inn, isSecond, target) {
  const pc = isPlayCricketSource(data);
  const battingName = inn.batting_team || data.batting_team || data.home_team || '—';
  const s = data.striker || {};
  const ns = data.non_striker || {};
  const b = data.current_bowler || {};

  document.getElementById('sb-left-team').innerHTML = formatBarlowTeam(battingName);
  document.getElementById('sb-right-team').innerHTML = formatBarlowTeam(bowlingTeamName(data, inn));
  document.getElementById('sb-runs').textContent = inn.runs + '/' + inn.wickets;

  const overLbl = document.getElementById('sb-overs-lbl');
  const overVal = document.getElementById('sb-overs');
  if (pc) {
    overVal.textContent = ordinal(oversInt(inn.overs)).toUpperCase();
    if (overLbl) overLbl.textContent = 'OVER UP';
  } else {
    overVal.textContent = inn.overs;
    if (overLbl) overLbl.textContent = 'OVERS';
  }

  document.getElementById('sb-bat1-name').textContent = barlowName(ns.name);
  document.getElementById('sb-bat1-runs').textContent = ns.runs != null ? ns.runs : '—';
  document.getElementById('sb-bat1-balls').textContent = '(' + (ns.balls != null ? ns.balls : '—') + ')';
  document.getElementById('sb-bat2-name').textContent = barlowName(s.name);
  document.getElementById('sb-bat2-runs').textContent = s.runs != null ? s.runs : '—';
  document.getElementById('sb-bat2-balls').textContent = '(' + (s.balls != null ? s.balls : '—') + ')';

  document.getElementById('sb-bowl-name').textContent = barlowName(b.name);
  document.getElementById('sb-bowl-figs').textContent = (b.wickets || 0) + '-' + (b.runs || 0);
  const bowlOversEl = document.getElementById('sb-bowl-overs');
  if (pc) {
    bowlOversEl.textContent = formatBowlerOversUp(b.overs);
  } else {
    bowlOversEl.textContent = '(' + (b.overs || '—') + ')';
  }

  renderBarlowOver(data.recent_over || [], pc);

  const crrVal = crr(inn.runs, inn.overs);
  document.getElementById('sb-crr').textContent = crrVal;

  const targetSeg = document.getElementById('sb-stat-target');
  const rrrLbl = document.getElementById('sb-stat-rrr-lbl');
  const rrrEl = document.getElementById('sb-rrr');

  if (isSecond && target) {
    targetSeg.classList.remove('hidden');
    document.getElementById('sb-target').textContent = target;
    const need = target - inn.runs;
    const bleft = ballsLeft(data.total_overs || 40, inn.overs);
    rrrLbl.textContent = 'REQUIRED RR:';
    rrrEl.textContent = need > 0 ? rrr(need, bleft) : '—';
  } else {
    targetSeg.classList.add('hidden');
    rrrLbl.textContent = 'LAST WKT:';
    rrrEl.textContent = lastWicketText(inn);
  }
}

// ══════════════════════════════════════════════════════════
// BOTTOM STRIP: target/CRR/required-RR (2nd innings) or CRR/last-wicket (1st innings)
// ══════════════════════════════════════════════════════════
function renderBottomStrip(data, inn, isSecond, target) {
  const crrVal = crr(inn.runs, inn.overs);
  const crrEl  = document.getElementById('bstrip-crr-val');
  const targetSeg = document.getElementById('bstrip-target-seg');
  const div1      = document.getElementById('bstrip-div-1');
  const rightLbl  = document.getElementById('bstrip-right-lbl');
  const rightVal  = document.getElementById('bstrip-right-val');

  if (isSecond && target) {
    targetSeg.classList.remove('hidden');
    div1.style.display = '';
    document.getElementById('bstrip-target-val').textContent = target;

    const need   = target - inn.runs;
    const bleft  = ballsLeft(data.total_overs || 40, inn.overs);
    const rrrStr = rrr(need, bleft);
    const rrrNum = parseFloat(rrrStr);
    const crrNum = parseFloat(crrVal);
    const urgency = need <= 0 ? 'ok' : rrrNum > crrNum + 2 ? 'crit' : rrrNum > crrNum + 0.5 ? 'warn' : 'ok';

    rightLbl.textContent = 'Required RR:';
    rightVal.textContent = need > 0 ? rrrStr : '—';
    rightVal.className   = 'bstrip-val ' + urgency;
    crrEl.textContent     = crrVal;
    crrEl.className       = 'bstrip-val ' + urgency;
  } else {
    targetSeg.classList.add('hidden');
    div1.style.display = 'none';
    rightLbl.textContent = 'Last Wkt:';
    rightVal.textContent = lastWicketText(inn);
    rightVal.className   = 'bstrip-val';
    crrEl.textContent     = crrVal;
    crrEl.className       = 'bstrip-val';
  }
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function render(data) {
  if (!data) return;

  applyDataPatternClass(data);
  applySponsor(data.sponsor);

  // Pre-match: no innings yet — show fixture details
  if (isPreMatch(data)) {
    renderPreMatch(data);
    return;
  }

  // Match underway — clear pre-match state
  document.getElementById('live-dot-left').style.display = '';
  clearInterval(countdownInterval);
  const pmEl = document.getElementById('panel-prematch');
  if (pmEl.classList.contains('active')) hideAllPanels();

  const inn1 = data.innings && data.innings[0];
  const inn2 = data.innings && data.innings[1];
  const inn  = inn2 || inn1;
  if (!inn) return;

  const isSecond = !!inn2;
  const target   = isSecond ? (data.target || inn1.runs + 1) : null;

  // ── Team corners ──
  const battingName = inn.batting_team || data.batting_team || data.home_team || '—';
  document.getElementById('team-corner-left').textContent  = battingName;
  document.getElementById('team-corner-right').textContent = bowlingTeamName(data, inn);
  document.getElementById('inn-label').textContent = isSecond ? '2nd Inn' : '1st Inn';

  // ── Score (centre) ──
  document.getElementById('score-runs').textContent  = inn.runs;
  document.getElementById('score-wkts').textContent  = '/' + inn.wickets;
  const pc = isPlayCricketSource(data);
  document.getElementById('score-overs').textContent = pc
    ? formatInningsOverUp(inn.overs)
    : inn.overs + ' OVERS';

  // ── Batters ──
  const s  = data.striker     || {};
  const ns = data.non_striker || {};

  document.getElementById('striker-name').textContent    = shortName(s.name);
  document.getElementById('striker-runs').textContent    = s.runs != null ? s.runs : '—';
  document.getElementById('striker-balls').textContent   = s.balls != null ? '(' + s.balls + ')' : '(—)';

  document.getElementById('nonstriker-name').textContent  = shortName(ns.name);
  document.getElementById('nonstriker-runs').textContent  = ns.runs != null ? ns.runs : '—';
  document.getElementById('nonstriker-balls').textContent = ns.balls != null ? '(' + ns.balls + ')' : '(—)';

  // ── Bowler ──
  const b = data.current_bowler || {};
  document.getElementById('bowler-name').textContent = shortName(b.name);
  document.getElementById('bowler-fig').textContent  = pc
    ? (b.wickets || 0) + '-' + (b.runs || 0) + ' · ' + formatBowlerOversUp(b.overs)
    : (b.wickets || 0) + '-' + (b.runs || 0) + ' (' + (b.overs || '—') + ')';

  // ── Recent over ──
  // Play Cricket relay: recent_over=[] → 6 placeholder dots (score is end-of-last-over;
  //   no ball-by-ball breakdown from the HTML scraper). PCS BLE mode: live ball data.
  renderRecentOver(data.recent_over || []);

  // ── Extras text (for milestone panel) ──
  const e = inn.extras || {};
  document.getElementById('extras-total').textContent = 'Total: ' + (e.total || 0);
  document.getElementById('extras-break').textContent = 'b' + (e.byes||0) + ' lb' + (e.leg_byes||0) + ' nb' + (e.no_balls||0) + ' w' + (e.wides||0);

  // ── Bottom strip ──
  renderBottomStrip(data, inn, isSecond, target);

  // ── Barlow layout mirror ──
  if (isBarlowLayout()) renderBarlow(data, inn, isSecond, target);

  // ── Result: match complete — show result panel ──
  if (isSecond && isMatchComplete(data)) {
    renderResultPanel(data);
    showPanel('result');
    return;
  }
}

// ══════════════════════════════════════════════════════════
// PANELS
// ══════════════════════════════════════════════════════════
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  if (id) {
    const el = document.getElementById('panel-' + id);
    if (el) el.classList.add('active');
  }
}

function hideAllPanels() {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
}

// ══════════════════════════════════════════════════════════
// WICKET ALERT
// ══════════════════════════════════════════════════════════
function dismissalText(b) {
  const sc = b.runs + '(' + b.balls + ')';
  const d  = (b.dismissal || '').trim();
  return shortName(b.name) + ' ' + sc + (d && d !== 'not out' ? ' ' + d : '');
}

function showWickets(texts) {
  if (!texts.length) return;
  S.isWicket = true;
  clearInterval(S.wicketCycle);

  let idx = 0;
  const setWkt = () => { document.getElementById('wicket-text').textContent = texts[idx % texts.length]; };
  setWkt();

  const bar = document.getElementById('wicket-timer');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  requestAnimationFrame(() => {
    bar.style.transition = `width ${CFG.wicketDurMs}ms linear`;
    bar.style.width = '0%';
  });

  showPanel('wicket');
  if (texts.length > 1) S.wicketCycle = setInterval(() => { idx++; setWkt(); }, CFG.wicketCycleMs);

  clearTimeout(S.wicketTimer);
  S.wicketTimer = setTimeout(() => {
    clearInterval(S.wicketCycle);
    S.isWicket = false;
    hideAllPanels();
  }, CFG.wicketDurMs);
}

// ══════════════════════════════════════════════════════════
// EXTRAS MILESTONE
// ══════════════════════════════════════════════════════════
function checkExtras(overs) {
  const done = oversInt(overs);
  if (done > 0 && done % CFG.extrasMilestone === 0 && done !== S.lastOversInt && !S.isWicket) {
    S.lastOversInt = done;
    showPanel('extras');
    setTimeout(() => { if (!S.isWicket) hideAllPanels(); }, CFG.extrasDurMs);
  }
}

// ══════════════════════════════════════════════════════════
// STALE / NOTICE LIFECYCLE
// ══════════════════════════════════════════════════════════
function markFresh() {
  S.lastFetchedAt = Date.now();
  document.getElementById('stale-bar').classList.remove('stale');
  hideStaleNotice();
  clearTimeout(S.staleTimer);
  clearTimeout(S.noticeTimer);
  clearNoticeRefresh();

  // Don't arm stale timers before the match has started — pre-match silence is expected
  if (!hasMatchStarted(S.lastData)) return;

  // After one over's worth of expected delay → amber pulse line
  S.staleTimer = setTimeout(() => {
    document.getElementById('stale-bar').classList.add('stale');
    // After a further delay (8 min total from last update) → scrolling viewer notice
    S.noticeTimer = setTimeout(() => {
      showStaleNotice(S.lastData);
      // Refresh the message every minute so "X min ago" stays current
      S.noticeRefresh = setInterval(() => {
        if (S.noticeActive && S.lastData) showStaleNotice(S.lastData);
      }, 60000);
    }, CFG.noticeAfterMs - CFG.staleAfterMs);
  }, CFG.staleAfterMs);
}

function clearNoticeRefresh() {
  clearInterval(S.noticeRefresh);
  S.noticeRefresh = null;
}

// ══════════════════════════════════════════════════════════
// POLL
// ══════════════════════════════════════════════════════════
async function poll() {
  try {
    const res  = await fetch(CFG.apiUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const activeInn = data.innings && (data.innings[1] || data.innings[0]);
    const newWkts   = activeInn ? activeInn.wickets : 0;
    const prev      = S.prevWickets;

    render(data);

    if (data.stale) {
      // Scraper flagged stale (both Play Cricket + ResultsVault failed) —
      // treat as immediate notice without waiting for the client-side timer
      document.getElementById('stale-bar').classList.add('stale');
      showStaleNotice(data);
    } else {
      markFresh();
    }

    // Wicket detection
    if (prev !== null && newWkts > prev && activeInn) {
      const newlyOut = (activeInn.batters || [])
        .filter(b => b.status === 'out')
        .slice(-(newWkts - prev));
      if (newlyOut.length) showWickets(newlyOut.map(dismissalText));
    }
    S.prevWickets = newWkts;

    checkExtras(activeInn ? activeInn.overs : '0');
    S.lastData = data;

  } catch(e) {
    console.warn('Poll failed:', e);
    document.getElementById('stale-bar').classList.add('stale');
    // If we've been failing long enough, show the viewer notice immediately
    if (S.lastFetchedAt && (Date.now() - S.lastFetchedAt) >= CFG.noticeAfterMs) {
      showStaleNotice(S.lastData);
    }
  }
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
(function init() {
  if (new URLSearchParams(location.search).has('demo')) return;
  poll();
  setInterval(poll, CFG.pollMs);
})();

  S.lastFetchedAt = Date.now() - minsAgo * 60 * 1000;
  document.getElementById('stale-bar').classList.add('stale');
  showStaleNotice(S.lastData);
};

// loadMockPreMatch() — simulate overlay state before match starts
window.loadMockPreMatch = () => {
  const mock = {
    home_team:'Worthing Warriors CC',
    away_team:'Newbery CC',
    home_xi:'1st XI', away_xi:'3rd XI',
    total_overs: 40,
    innings: [],
    match: {
      date: '29 June 2026 @ 13:00',
      competition: 'Sussex Cricket League - Division 8 Central',
      status: 'NOT STARTED',
      toss: 'Toss not yet taken',
    },
    stale: false,
    last_updated: null,
  };
  S.lastData    = mock;
  S.prevWickets = null;
  render(mock);
  markFresh(); // won't arm timers (match not started)
};

(function autoDemo() {
  const demo = new URLSearchParams(location.search).get('demo');
  if (demo === null) return;
  if (demo === 'prematch') { loadMockPreMatch(); return; }
  if (demo === 'inn1' || demo === 'first') { loadMock(1); return; }
  if (demo === 'crit' || demo === 'warn' || demo === 'ok') { loadMock(2, demo); return; }
  loadMockAdith();
})();
</script>
