<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in — CricRelay</title>
  <style>
    :root { --bg:#0b1020; --card:#121a2e; --border:rgba(255,255,255,.1); --text:#f1f5f9; --muted:#94a3b8; --link:#7dd3fc; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:24px 16px; }
    .wrap { max-width:420px; margin:0 auto; }
    h1 { font-size:1.35rem; margin:0 0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; }
    label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 6px; }
    input { width:100%; min-height:46px; border-radius:10px; border:1px solid var(--border); background:#1a2339; color:var(--text); font-size:15px; padding:0 12px; }
    button { width:100%; margin-top:18px; min-height:48px; border-radius:10px; border:1px solid rgba(34,197,94,.35); background:linear-gradient(180deg,#2ea043,#166534); color:#fff; font-weight:700; font-size:16px; cursor:pointer; }
    .flash { background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.35); color:#fecaca; padding:10px 12px; border-radius:10px; margin-bottom:14px; font-size:14px; }
    .sub { color:var(--muted); font-size:14px; margin-top:16px; }
    a { color:var(--link); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Log in</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    <div class="card">
      <form method="post" action="{{ url_for('login_page') }}">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <button type="submit">Log in</button>
      </form>
    </div>
    <p class="sub"><a href="{{ url_for('register_page') }}">Register</a> · <a href="{{ url_for('cricrelay_home') }}">Home</a></p>
  </div>
</body>
</html>
