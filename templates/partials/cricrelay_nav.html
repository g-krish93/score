<header class="cr-header">
  <div class="cr-header-inner">
    <a href="{% if session.get('org_id') %}{{ url_for('dashboard_home') }}{% else %}{{ url_for('cricrelay_home') }}{% endif %}" class="cr-brand" aria-label="CricRelay home">
      <img class="cr-brand-logo" src="{{ url_for('static', filename='cricrelay-icon.svg') }}" alt="" aria-hidden="true">
      <span class="cr-brand-text">CricRelay</span>
    </a>

    {% if session.get('org_id') %}
    <nav class="cr-nav cr-nav--app" aria-label="Primary">
      <a href="{{ url_for('dashboard_home') }}" class="cr-navlink {% if request.endpoint == 'dashboard_home' %}is-active{% endif %}">Home</a>
      <a href="{{ url_for('dashboard') }}" class="cr-navlink {% if request.endpoint == 'dashboard' %}is-active{% endif %}">Squad management</a>
      <a href="{{ url_for('dashboard_relays') }}" class="cr-navlink {% if request.endpoint == 'dashboard_relays' %}is-active{% endif %}">Current streams</a>
      <form action="{{ url_for('logout') }}" method="post" class="cr-nav-form"><button type="submit" class="cr-navlink cr-navlink-btn">Log out</button></form>
    </nav>
    {% else %}
    <button type="button" class="cr-nav-toggle" data-cr-nav-toggle aria-expanded="false" aria-controls="cr-nav-drawer" aria-label="Open menu">
      <span class="cr-nav-toggle-bar" aria-hidden="true"></span>
      <span class="cr-nav-toggle-bar" aria-hidden="true"></span>
      <span class="cr-nav-toggle-bar" aria-hidden="true"></span>
    </button>
    <nav class="cr-nav cr-nav--marketing" aria-label="Primary">
      <a href="{{ url_for('cricrelay_home') }}#how" class="cr-navlink">How it works</a>
      <a href="{{ url_for('login_page') }}" class="cr-navlink {% if request.endpoint == 'login_page' %}is-active{% endif %}">Log in</a>
      <a href="{{ url_for('register_page') }}" class="cr-btn cr-btn-primary cr-btn-header">Start free</a>
    </nav>
    <div id="cr-nav-drawer" class="cr-nav-drawer" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
      <div class="cr-nav-drawer-inner">
        <a href="{{ url_for('cricrelay_home') }}#how">How it works</a>
        <a href="{{ url_for('login_page') }}">Log in</a>
        <a href="{{ url_for('register_page') }}" class="cr-btn cr-btn-primary cr-btn-block">Start free</a>
      </div>
    </div>
    {% endif %}
  </div>
</header>
