<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Cricket Overlay</title>
  <style>
    /* CricRelay Scoreboard Overlay — Sky/ESPN broadcast restyle by Lovable */
    :root {
  --team1: #2f7bff;
  --team2: #ffd24a;
  --bg: rgba(7, 12, 28, 0.92);
  --fg: #f5f8ff;
  --muted: #8ea0c2;
  --overlay-scale: 1;
  --overlay-box-color: #0a1838;
  --ink-0:  #05091a;
  --ink-1:  #0a1330;
  --ink-2:  #0f1c47;
  --ink-3:  #16275f;
  --line:   rgba(255, 255, 255, 0.10);
  --line-2: rgba(255, 255, 255, 0.18);
  --accent-hot: #ff3b3b;
  --accent-4:   #ffd24a;
  --accent-6:   #ff8a1f;
  --accent-ok:  #22d07a;
  --shadow-lg:  0 18px 40px rgba(0, 0, 0, 0.55);
  --shadow-md:  0 10px 22px rgba(0, 0, 0, 0.40);
  --font-num:   ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: transparent !important;
}
    {% if embed_mode|default(false) %}
    html.embed-mode, html.embed-mode body {
      background: transparent !important;
      overflow: hidden;
    }
    html.embed-mode #stale,
    html.embed-mode #matchTag,
    html.embed-mode #flash,
    html.embed-mode #momentum,
    html.embed-mode #pressureWrap {
      display: none !important;
    }
    html.embed-mode body.relay-active #overlay {
      left: 50%;
      right: auto;
      bottom: max(8px, env(safe-area-inset-bottom, 0px));
      width: min(92vw, 420px);
      max-width: 420px;
      transform: translateX(-50%);
    }
  {% endif %}
body {
  font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  font-feature-settings: "ss01", "cv11", "tnum";
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#overlay {
  position: fixed;
  z-index: 1;
  color: var(--fg);
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
}
body:not(.relay-active) #overlay {
  left: 0;
  right: 0;
  bottom: 0;
  padding: calc(10px * var(--overlay-scale)) calc(16px * var(--overlay-scale)) calc(12px * var(--overlay-scale));
  font-size: calc(14px * var(--overlay-scale));
  background: linear-gradient(180deg, rgba(10, 19, 48, 0.96) 0%, rgba(5, 9, 26, 0.96) 100%);
  border-top: 1px solid var(--line-2);
  box-shadow: 0 -2px 0 rgba(255, 255, 255, 0.04) inset, 0 -18px 40px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px) saturate(140%);
  -webkit-backdrop-filter: blur(6px) saturate(140%);
}
body:not(.relay-active) #overlay::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--team1) 0%, var(--team1) 38%, #ffffff 50%, var(--team2) 62%, var(--team2) 100%);
  opacity: 0.95;
}
body:not(.relay-active) #overlay::after {
  content: "";
  position: absolute;
  inset: 3px 0 0 0;
  background: repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 8px);
  pointer-events: none;
  mix-blend-mode: overlay;
}
#stale {
  position: absolute; right: 14px; top: 8px;
  color: var(--accent-hot); display: none;
  font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  font-size: calc(10px * var(--overlay-scale));
}
#flash {
  position: absolute; left: 14px; top: 8px;
  font-weight: 900; display: none;
  letter-spacing: 0.06em; text-transform: uppercase;
  font-size: calc(13px * var(--overlay-scale));
}
.muted { color: var(--muted); }
.row { margin: 3px 0; white-space: pre-wrap; }
.title { font-weight: 800; letter-spacing: 0.01em; }
.section-title { color: #a9bce1; font-size: calc(10.5px * var(--overlay-scale)); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 800; }
.result {
  color: var(--accent-ok); font-weight: 900; letter-spacing: 0.04em;
  padding: 5px 10px; border: 1px solid rgba(34,208,122,0.45); border-radius: 4px;
  background: linear-gradient(180deg, rgba(34,208,122,0.18), rgba(34,208,122,0.08));
  text-transform: uppercase;
}
.team1 { color: var(--team1); }
.team2 { color: var(--team2); }
.score-pop { animation: pop .32s ease-out; display: inline-block; }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
.score-strip {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) auto minmax(230px, 1fr);
  align-items: stretch; gap: 8px; margin-top: 6px; padding: 8px;
  background: linear-gradient(180deg, rgba(22,39,95,0.55), rgba(10,24,56,0.55));
  border: 1px solid var(--line-2); border-radius: 6px;
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.05);
}
.team-box {
  position: relative; min-height: 62px; border-radius: 4px;
  display: grid; align-content: center; gap: 3px; padding: 9px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.015) 100%);
  border: 1px solid var(--line); overflow: hidden; isolation: isolate;
}
.team-box::before {
  content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0.18;
  background: radial-gradient(120% 100% at 0% 50%, currentColor, transparent 60%);
}
.team-box.left  { color: var(--team1); border-left: 4px solid var(--team1); }
.team-box.right { color: var(--team2); border-right: 4px solid var(--team2); text-align: right; }
.team-box.right::before { background: radial-gradient(120% 100% at 100% 50%, currentColor, transparent 60%); }
.team-name { font-size: calc(13px * var(--overlay-scale)); font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff; text-shadow: 0 1px 0 rgba(0,0,0,0.5); }
.team-sub  { font-size: calc(10px * var(--overlay-scale)); color: #b9c8e6; letter-spacing: 0.04em; }
.team-stat { font-family: var(--font-num); font-size: calc(13px * var(--overlay-scale)); font-weight: 800; color: #ffffff; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.main-score {
  position: relative; border-radius: 4px; text-align: center; padding: 6px 18px 8px; min-width: 170px;
  background: linear-gradient(180deg, #1a3683 0%, #0c1f55 100%);
  border: 1px solid rgba(140,178,255,0.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(0,0,0,0.30), 0 6px 18px rgba(0,0,0,0.45);
}
.main-score::after {
  content: ""; position: absolute; left: 6px; right: 6px; top: 1px; height: 40%;
  border-radius: 4px 4px 14px 14px / 4px 4px 60% 60%;
  background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0));
  pointer-events: none;
}
.score-title { font-size: calc(10.5px * var(--overlay-scale)); color: var(--accent-4); font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase; }
.score-big {
  font-family: var(--font-num); font-size: calc(36px * var(--overlay-scale));
  line-height: 0.95; font-weight: 900; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; color: #ffffff;
  text-shadow: 0 1px 0 rgba(0,0,0,0.65), 0 0 18px rgba(80,140,255,0.25);
}
.score-meta {
  font-family: var(--font-num); font-size: calc(11.5px * var(--overlay-scale));
  color: #dbe6ff; margin-top: 4px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
}
.bowler-panel { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.balls-row { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
.ball-chip {
  width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-num); font-size: calc(10.5px * var(--overlay-scale)); font-weight: 900; color: #eaf2ff;
  background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
  border: 1px solid rgba(201,219,248,0.30);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.35);
  transition: transform .15s ease;
}
.ball-chip.w { color: #fff; background: linear-gradient(180deg,#ff5c5c,#c81e1e); border-color: rgba(255,200,200,0.60); box-shadow: 0 0 0 1px rgba(255,60,60,0.35), 0 2px 6px rgba(200,0,0,0.45); }
.ball-chip.f { color: #1a1300; background: linear-gradient(180deg,#ffe98a,#f5b400); border-color: rgba(255,240,170,0.70); box-shadow: 0 0 0 1px rgba(245,180,0,0.30), 0 2px 6px rgba(200,140,0,0.40); }
.ball-chip.s { color: #1a0a00; background: linear-gradient(180deg,#ffb766,#ff7a18); border-color: rgba(255,215,175,0.70); box-shadow: 0 0 0 1px rgba(255,120,24,0.35), 0 2px 6px rgba(200,90,0,0.45); }
.statline { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  border-radius: 3px; border: 1px solid rgba(178,201,240,0.30);
  background: linear-gradient(180deg, rgba(60,96,168,0.45), rgba(28,54,110,0.55));
  padding: 4px 10px; font-size: calc(10.5px * var(--overlay-scale)); font-weight: 800; color: #eaf1ff;
  letter-spacing: 0.10em; text-transform: uppercase; font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 0 rgba(0,0,0,0.40); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
}
#momentum { margin-top: 7px; display: flex; gap: 5px; flex-wrap: wrap; }
.mom {
  font-family: var(--font-num); font-size: calc(11px * var(--overlay-scale));
  border-radius: 3px; padding: calc(2px * var(--overlay-scale)) calc(8px * var(--overlay-scale));
  border: 1px solid rgba(171,193,230,0.25);
  background: linear-gradient(180deg, rgba(106,138,193,0.30), rgba(58,82,132,0.30));
  font-weight: 900; color: #eaf1ff; text-shadow: 0 1px 0 rgba(0,0,0,0.40); font-variant-numeric: tabular-nums;
}
.mom.w { background: linear-gradient(180deg,rgba(255,92,92,0.35),rgba(180,30,30,0.40)); border-color: rgba(255,180,180,0.40); }
.mom.f { background: linear-gradient(180deg,rgba(255,233,138,0.30),rgba(200,150,0,0.30)); border-color: rgba(255,230,150,0.45); color: #fff7d8; }
.mom.s { background: linear-gradient(180deg,rgba(255,138,31,0.35),rgba(200,90,0,0.35)); border-color: rgba(255,200,150,0.45); }
#pressureWrap { margin-top: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.10); overflow: hidden; display: none; border: 1px solid var(--line); }
#pressureFill { height: 100%; width: 0%; transition: width .35s ease; background: linear-gradient(90deg,#22d07a 0%,#ffd24a 55%,#ff3b3b 100%); box-shadow: 0 0 12px rgba(255,60,60,0.35); }
.flash-4 { color: var(--accent-4); text-shadow: 0 0 12px rgba(255,210,74,0.55); }
.flash-6 { color: var(--accent-6); text-shadow: 0 0 12px rgba(255,138,31,0.65); }
.flash-w { color: var(--accent-hot); text-shadow: 0 0 12px rgba(255,59,59,0.70); }
.theme-neon { --bg: rgba(9,11,26,0.94); --fg: #e5fcff; --muted: #86b0c0; }
.theme-neon .score-strip, .theme-neon .main-score { border-color: rgba(85,245,255,0.45); box-shadow: 0 0 22px rgba(85,245,255,0.18), var(--shadow-md); }
.theme-neon .score-big { text-shadow: 0 0 14px rgba(85,245,255,0.55); }
.theme-minimal { --bg: rgba(0,0,0,0.70); }
.theme-minimal #overlay::before, .theme-minimal #overlay::after { display: none; }
.theme-minimal .score-strip, .theme-minimal .main-score, .theme-minimal .team-box, .theme-minimal .pill { border-radius: 2px; box-shadow: none; }
.density-compact #overlay { padding: 6px 10px; }
.density-compact .score-strip { padding: 6px; gap: 6px; }
.density-compact .score-big { font-size: calc(28px * var(--overlay-scale)); }
.density-compact .team-box { min-height: 46px; padding: 6px 10px; }
.density-compact .ball-chip { width: 18px; height: 18px; }
html.overlay-size-1 { --widget-max-w: 210px; --widget-pad: 9px;  --widget-name: 8px;  --widget-score: 20px; --widget-ov: 9px;  --widget-vs: 9px;  }
html.overlay-size-2 { --widget-max-w: 260px; --widget-pad: 11px; --widget-name: 9px;  --widget-score: 24px; --widget-ov: 10px; --widget-vs: 10px; }
html.overlay-size-3 { --widget-max-w: 320px; --widget-pad: 13px; --widget-name: 10px; --widget-score: 30px; --widget-ov: 11px; --widget-vs: 11px; }
html.overlay-size-4 { --widget-max-w: 380px; --widget-pad: 15px; --widget-name: 11px; --widget-score: 36px; --widget-ov: 12px; --widget-vs: 12px; }
html.overlay-size-5 { --widget-max-w: 440px; --widget-pad: 17px; --widget-name: 12px; --widget-score: 42px; --widget-ov: 13px; --widget-vs: 13px; }
body.relay-active #overlay {
  left: 50%; right: auto; top: auto;
  bottom: max(12px, env(safe-area-inset-bottom, 0px));
  width: min(var(--widget-max-w, 320px), 92vw); max-width: var(--widget-max-w, 320px);
  padding: 0; background: transparent; border: none; box-shadow: none;
  transform: translateX(-50%) translate3d(0, 0, 0);
}
@media (orientation: landscape) { body.relay-active #overlay { bottom: max(14px, env(safe-area-inset-bottom, 0px)); } }
body.relay-active #overlay::before, body.relay-active #overlay::after { display: none; }
body.relay-active #matchTag, body.relay-active #flash, body.relay-active #momentum,
body.relay-active #pressureWrap, body.relay-active .statline { display: none !important; }
body.relay-active #stale { top: 4px; right: 8px; font-size: 11px; }
.relay-widget {
  position: relative;
  background: linear-gradient(165deg, #112766 0%, #07112e 100%);
  border: 1px solid rgba(140,178,255,0.42); border-radius: 8px;
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.10), inset 0 -1px 0 rgba(0,0,0,0.40);
  padding: var(--widget-pad, 13px); text-align: center; overflow: hidden; isolation: isolate;
}
.relay-widget::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--team1) 0%, var(--team1) 38%, #ffffff 50%, var(--team2) 62%, var(--team2) 100%);
}
.relay-widget::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(120% 80% at 50% -20%, rgba(120,170,255,0.18), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 9px);
  pointer-events: none;
}
.relay-widget-stale { font-size: calc(var(--widget-name,10px) - 1px); font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #ffb4b4; margin-bottom: 6px; }
.relay-widget-result { font-size: calc(var(--widget-name,10px) + 1px); font-weight: 900; color: #a8f0c5; margin-bottom: 7px; line-height: 1.25; letter-spacing: 0.04em; text-transform: uppercase; }
.relay-widget-match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px 10px; }
.relay-widget-side { min-width: 0; }
.relay-widget-side.team2-side { text-align: right; }
.relay-widget-name { font-size: var(--widget-name,10px); font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #c5d7f5; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.relay-widget-side.team1-side .relay-widget-name { color: var(--team1); filter: brightness(1.20); }
.relay-widget-side.team2-side .relay-widget-name { color: var(--team2); filter: brightness(1.15); }
.relay-widget-score { font-family: var(--font-num); font-size: var(--widget-score,30px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; color: #ffffff; margin-top: 5px; text-shadow: 0 1px 0 rgba(0,0,0,0.55); }
.relay-widget-ov { font-family: var(--font-num); font-size: var(--widget-ov,11px); font-weight: 700; color: #9ab2d6; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.relay-widget-vs { font-size: var(--widget-vs,11px); font-weight: 900; color: #5c6f93; letter-spacing: 0.12em; padding: 0 4px; text-transform: uppercase; }
.relay-widget-chase {
  margin-top: 9px; padding: 7px 12px; border-radius: 4px;
  background: linear-gradient(180deg, rgba(34,208,122,0.22), rgba(34,208,122,0.10));
  border: 1px solid rgba(34,208,122,0.45); font-size: calc(var(--widget-name,10px) + 1px);
  font-weight: 800; color: #ecfff5; letter-spacing: 0.04em; text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
}
.relay-widget-chase strong { font-family: var(--font-num); font-weight: 900; font-variant-numeric: tabular-nums; color: #ffffff; }
.relay-widget-chase .relay-chase-muted { font-weight: 700; color: #c4f0d6; }
.relay-widget-wait { font-size: var(--widget-name,10px); color: #95a7c7; line-height: 1.45; margin-top: 6px; }
.relay-board-main { margin-top: 6px; }
.relay-board-team { font-size: calc(var(--widget-name,10px) + 2px); font-weight: 900; letter-spacing: 0.10em; text-transform: uppercase; color: var(--team1); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; filter: brightness(1.15); }
.relay-board-total { font-family: var(--font-num); font-size: calc(var(--widget-score,30px) + 4px); font-weight: 900; line-height: 1.02; font-variant-numeric: tabular-nums; color: #ffffff; margin-top: 5px; text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 18px rgba(80,140,255,0.20); }
.relay-board-meta { font-family: var(--font-num); font-size: var(--widget-ov,11px); font-weight: 700; color: #9ab2d6; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
.relay-board-batters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(140,178,255,0.22); text-align: left; }
.relay-board-bat { font-family: var(--font-num); font-size: calc(var(--widget-name,10px) + 1px); font-weight: 800; color: #dbeafe; line-height: 1.25; font-variant-numeric: tabular-nums; }
.relay-board-bat.on-strike { color: #ffffff; position: relative; }
.relay-board-bat.on-strike::after { content: "•"; margin-left: 4px; color: var(--accent-4); text-shadow: 0 0 8px rgba(255,210,74,0.65); }
.relay-board-bat .bat-name { display: block; font-family: "Inter","Segoe UI",sans-serif; font-size: calc(var(--widget-name,10px) - 1px); font-weight: 800; color: #9ab2d6; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.relay-board-inns1 { margin-top: 8px; font-family: var(--font-num); font-size: calc(var(--widget-name,10px)); color: #94a3b8; font-weight: 700; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.wk-ios body.relay-active .relay-widget { background: #0d2154; -webkit-transform: translate3d(0,0,0); }
.wk-ios body.relay-active #overlay { z-index: 2147483646; bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
@media (orientation: landscape) { .wk-ios body.relay-active #overlay { bottom: max(16px, env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 720px) {
  .score-strip { grid-template-columns: 1fr; }
  .team-box.right { text-align: left; border-right: 1px solid var(--line); border-left: 4px solid var(--team2); }
  .main-score { min-width: 0; }
  .balls-row { justify-content: flex-start; }
}
@media (min-width: 1600px) {
  body:not(.relay-active) #overlay { padding: 12px 24px 14px; }
  body:not(.relay-active) #overlay::before { height: 4px; }
  .score-strip { grid-template-columns: minmax(280px,1fr) auto minmax(260px,1fr); gap: 12px; }
  .team-name  { font-size: calc(14px * var(--overlay-scale)); }
  .team-sub   { font-size: calc(11px * var(--overlay-scale)); }
  .team-stat  { font-size: calc(14px * var(--overlay-scale)); }
  .score-big  { font-size: calc(42px * var(--overlay-scale)); }
  .score-meta { font-size: calc(12.5px * var(--overlay-scale)); }
  .pill       { font-size: calc(11px * var(--overlay-scale)); padding: 5px 12px; }
  .ball-chip  { width: 24px; height: 24px; }
  .section-title { font-size: calc(11px * var(--overlay-scale)); }
  .row        { font-size: calc(15px * var(--overlay-scale)); }
}

/* ================================================================
   THEME: compact — Club Ticker
   Ultra-slim bar for small overlays. All the data, half the space.
   ================================================================ */
.theme-compact body:not(.relay-active) #overlay {
  padding: calc(5px * var(--overlay-scale)) calc(10px * var(--overlay-scale));
}
.theme-compact body:not(.relay-active) #overlay::after { display: none; }
.theme-compact .score-strip {
  gap: 4px; margin-top: 3px; padding: 4px;
  border-radius: 4px;
  background: rgba(8,14,40,0.95);
  grid-template-columns: minmax(160px,1fr) auto minmax(140px,1fr);
}
.theme-compact .team-box { min-height: 38px; padding: 4px 8px; gap: 1px; border-radius: 3px; }

<body{% if embed_mode|default(false) %} class="embed-mode"{% endif %}>
  <div id="overlay">
    <div id="stale">●</div>
    <div id="flash"></div>
    <div id="matchTag" class="row muted"></div>
    <div id="content" class="row">Loading...</div>
    <div id="pressureWrap"><div id="pressureFill"></div></div>
    <div id="momentum"></div>
  </div>
  <script>
    (function () {
      const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent || "") ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (ios) document.documentElement.classList.add("wk-ios");
      {% if embed_mode|default(false) %}
      document.documentElement.classList.add("embed-mode");
      {% endif %}
    })();

    let lastData = null;
    let failCount = 0;
    let lastBallToken = "";
    let lastScoreKey = "";
    let lastRelayKey = "";
    const MATCH_ID = "{{ match_id|default('default') }}";
    const MATCH_QUERY = `match=${encodeURIComponent(MATCH_ID)}`;
    function withMatch(url) {
      const sep = url.includes("?") ? "&" : "?";
      return `${url}${sep}${MATCH_QUERY}`;
    }

    const text = (v) => (v === null || v === undefined || v === "" ? "—" : String(v));
    const pad = (v) => text(v).padEnd(18, " ");
    function abbreviateBmaccTeam(name) {
      const s = String(name || "").trim();
      if (!s || s === "—") return null;
      if (!/^brighton\s+malayalee\s+association\s+cc\b/i.test(s)) return null;
      if (/\b2nd(\s+xi)?\b/i.test(s) || /\-\s*2nd\b/i.test(s)) return "BMACC 2nd XI";
      if (/\b1st(\s+xi)?\b/i.test(s) || /\-\s*1st\b/i.test(s)) return "BMACC 1st XI";
      const afterClub = s.replace(/^brighton\s+malayalee\s+association\s+cc\s*/i, "").trim();
      if (!afterClub || /^\([^)]*\)$/.test(afterClub)) return "BMACC";
      return "BMACC";
    }
    function shortTeamName(name, maxLen = 28) {
      let s = String(name || "").trim();
      if (!s || s === "—") return "—";
      const bmacc = abbreviateBmaccTeam(s);
      if (bmacc) return bmacc.length > maxLen ? `${bmacc.slice(0, maxLen - 1)}…` : bmacc;
      s = s.replace(/\s+CC(\s*\([^)]*\))?$/i, "").replace(/\s+-\s+[^-]+$/i, "").trim();
      if (s.length > maxLen) s = `${s.slice(0, maxLen - 1)}…`;
      return s;
    }
    function applyOverlaySize(data) {
      const root = document.documentElement;
      for (let i = 1; i <= 5; i += 1) root.classList.remove(`overlay-size-${i}`);
      let size = Number(data.overlay_size);
      if (!Number.isFinite(size) || size < 1 || size > 5) {
        const sc = Number(data.overlay_scale);
        size = Number.isFinite(sc) ? Math.min(5, Math.max(1, Math.round(1 + (sc - 0.8) / 0.25))) : 3;
      }
      root.classList.add(`overlay-size-${Math.round(size)}`);
      const sc = Number(data.overlay_scale);
      const scale = Number.isFinite(sc) ? Math.min(1.8, Math.max(0.8, sc)) : 0.8 + (size - 1) * 0.25;
      root.style.setProperty("--overlay-scale", String(scale));
    }
    function setTheme(data) {
      const body = document.body;
      body.classList.remove("theme-classic", "theme-neon", "theme-minimal", "theme-compact", "theme-ai", "theme-stadium");
      const theme = String(data.theme || "classic").toLowerCase();
      if (theme === "neon")         body.classList.add("theme-neon");
      else if (theme === "minimal") body.classList.add("theme-minimal");
      else if (theme === "compact") body.classList.add("theme-compact");
      else if (theme === "ai")      body.classList.add("theme-ai");
      else if (theme === "stadium") body.classList.add("theme-stadium");
      else                          body.classList.add("theme-classic");
      body.classList.remove("density-compact");
      if (String(data.overlay_density || "expanded").toLowerCase() === "compact") {
        body.classList.add("density-compact");
      }
      document.documentElement.style.setProperty("--team1", data.team1_color || "#3b82f6");
      document.documentElement.style.setProperty("--team2", data.team2_color || "#facc15");
      applyOverlaySize(data);
      const box = String(data.overlay_box_color || "").trim();
      document.documentElement.style.setProperty(
        "--overlay-box-color",
        /^#[0-9a-fA-F]{6}$/.test(box) ? box : "#0b1f56"
      );
    }
    function renderMomentum(data) {
      const holder = document.getElementById("momentum");
      const list = (data.current_over || []).slice(-6);
      holder.innerHTML = list.map((v) => {
        const low = String(v).toLowerCase();
        const cls = low.includes("w") ? "w" : low === "4" ? "f" : low === "6" ? "s" : "";
        return `<span class="mom ${cls}">${v}</span>`;
      }).join("");
    }
    function renderPressure(data) {
      const wrap = document.getElementById("pressureWrap");
      const fill = document.getElementById("pressureFill");
      const rb = data.relay_bundle || {};
      if (rb.enabled) {
        wrap.style.display = "none";
        fill.style.width = "0%";
        return;
      }
      if (data.innings !== 2 || data.rrr === null || data.crr === null) {
        wrap.style.display = "none";
        fill.style.width = "0%";
        return;
      }
      wrap.style.display = "block";
      const ratio = Math.max(0, Math.min(2, Number(data.rrr || 0) / Math.max(0.1, Number(data.crr || 0))));
      fill.style.width = `${Math.round((ratio / 2) * 100)}%`;
    }
    function maybeFlash(data) {
      const token = (data.current_over || [])[data.current_over.length - 1] || "";
      if (!token || token === lastBallToken) return;
      lastBallToken = token;
      const flash = document.getElementById("flash");
      flash.className = "";
      if (token.startsWith("4")) { flash.textContent = "FOUR!"; flash.classList.add("flash-4"); }
      else if (token.startsWith("6")) { flash.textContent = "SIX!"; flash.classList.add("flash-6"); }
      else if (token.startsWith("W")) { flash.textContent = "WICKET!"; flash.classList.add("flash-w"); }
      else return;
      flash.style.display = "block";
      setTimeout(() => { flash.style.display = "none"; }, 1200);
    }

    function renderMainScore(data, resultRow) {
      const scoreKey = `${data.runs}-${data.wickets}`;
      const popClass = scoreKey !== lastScoreKey ? "score-pop" : "";
      lastScoreKey = scoreKey;
      const strikerLine = `${text(data.striker)} ${text(data.striker_runs || "")}${data.striker_balls != null ? ` (${data.striker_balls})` : ""}`.trim();
      const nonStrikerLine = `${text(data.non_striker)} ${text(data.non_striker_runs || "")}${data.non_striker_balls != null ? ` (${data.non_striker_balls})` : ""}`.trim();
      const bowlerLine = `${text(data.current_bowler)} ${text(data.current_bowler_fig || "")}`.trim();
      const overBalls = (data.current_over || []).slice(-6).map((v) => {
        const low = String(v).toLowerCase();
        const cls = low.includes("w") ? "w" : low === "4" ? "f" : low === "6" ? "s" : "";
        return `<span class="ball-chip ${cls}">${text(v)}</span>`;
      }).join("");
      const chasePill = data.innings === 2
        ? `<span class="pill">Need ${text(data.runs_needed)} off ${text(data.balls_remaining)}b</span><span class="pill">RRR ${text(data.rrr)}</span>`
        : `<span class="pill">CRR ${text(data.crr)}</span>`;
      return (
        resultRow +
        `<div class="score-strip">` +
          `<div class="team-box left">` +
            `<div class="team-name team1">${text(data.batting_team)}</div>` +
            `<div class="team-stat">${strikerLine}</div>` +
            `<div class="team-sub">${nonStrikerLine}</div>` +
          `</div>` +
          `<div class="main-score">` +
            `<div class="score-title">${text(data.team1 || data.batting_team)} vs ${text(data.team2 || data.bowling_team)}</div>` +
            `<div class="score-big ${popClass}">${text(data.runs)}/${text(data.wickets)}</div>` +
            `<div class="score-meta">${text(data.overs_display)} ov${data.innings ? ` · INN ${text(data.innings)}` : ""}</div>` +
          `</div>` +
          `<div class="team-box right">` +
            `<div class="team-name team2">${text(data.bowling_team)}</div>` +
            `<div class="bowler-panel">` +
              `<div class="team-sub">${bowlerLine}</div>` +
              `<div class="balls-row">${overBalls}</div>` +
            `</div>` +
            `<div class="team-sub">${data.innings === 2 ? `Target ${text(data.target)}` : "Fielding"}</div>` +
          `</div>` +
        `</div>` +
        `<div class="statline">${chasePill}</div>`
      );
    }

    function relayHasScores(snap) {
      const i1 = snap.innings_1 || {};
      const i2 = snap.innings_2 || {};
      const ok = (x) =>
        x &&
        ((x.score != null && String(x.score).trim() !== "") ||
          (x.runs != null && !Number.isNaN(Number(x.runs))));
      return ok(i1) || ok(i2);
    }

    function relayInningsRuns(inv) {
      if (!inv || typeof inv !== "object") return null;
      const r = inv.runs;
      if (r != null && r !== "" && !Number.isNaN(Number(r))) return Number(r);
      const sc = String(inv.score || "").trim();
      const m = sc.match(/^(\d+)\s*\/\s*\d+/);
      if (m) return Number(m[1]);
      return null;
    }

    /** Limited-overs chase: target = 1st innings runs + 1 (no DLS in relay feed). */
    function relayChaseHtml(i1, i2, s2) {
      const r1 = relayInningsRuns(i1);
      const r2 = relayInningsRuns(i2);
      if (r1 === null || r2 === null) return "";
      if (!String(s2 || "").trim()) return "";
      const target = r1 + 1;
      const need = Math.max(0, target - r2);
      let tail = "";
      if (r2 >= target) {
        tail = ` · <span class="relay-chase-muted">Target reached</span>`;
      } else {
        tail = ` · <span class="relay-chase-muted">Need ${need} to win</span>`;
      }
      return (
        `<div class="relay-widget-chase" role="status" aria-live="polite">` +
        `Target <strong>${text(String(target))}</strong>${tail}` +
        `</div>`
      );
    }

    function relayMatchResultLine(snap) {
      const st = text(snap.status || "");
      if (st !== "—" && /won by/i.test(st)) {
        return `<div class="relay-widget-result">${st}</div>`;
      }
      return "";
    }

    function relayStaleLine(stale) {
      return stale ? `<div class="relay-widget-stale">Score sync delayed</div>` : "";
    }

    function relayWidgetSide(sideClass, team, score, overs, popClass) {
      const ov = overs && overs !== "—"
        ? `<div class="relay-widget-ov">${text(overs)} ov</div>`
        : "";
      return (
        `<div class="relay-widget-side ${sideClass}">` +
          `<div class="relay-widget-name">${shortTeamName(team)}</div>` +
          `<div class="relay-widget-score ${popClass}">${score || "—"}</div>` +
          ov +
        `</div>`
      );
    }

    function formatBatsmanLine(b, fallbackLabel) {
      if (!b || b.runs == null) return "";
      const nm = (b.name && String(b.name).trim()) ? String(b.name).trim() : fallbackLabel;
      const balls = b.balls != null ? ` (${b.balls})` : "";
      const strike = b.on_strike ? " on-strike" : "";
      return (
        `<div class="relay-board-bat${strike}">` +
          `<span class="bat-name">${text(nm)}</span>` +
          `${text(String(b.runs))}${balls}` +
        `</div>`
      );
    }

    function renderRelayScoreboard(data, resultRow) {
      const b = data.relay_bundle || {};
      const snap = b.snapshot || {};
      const live = snap.live || {};
      const errNote = b.last_error
        ? `<div class="relay-widget-wait" style="color:#fca5a5;">${text(b.last_error)}</div>`
        : "";
      if (live.runs == null) return null;

      const scoreKey = `${live.runs}-${live.wickets}-${live.overs}-${(live.batsman_1||{}).runs}-${(live.batsman_2||{}).runs}`;
      const popClass = scoreKey !== lastRelayKey ? "score-pop" : "";
      lastRelayKey = scoreKey;

      const team = text(live.batting_team || snap.fixture_title || "—");
      const wk = live.wickets != null ? text(String(live.wickets)) : "0";
      const total = `<span class="${popClass}">${text(String(live.runs))}/${wk}</span>`;
      const overs = live.overs ? `${text(live.overs)} ov` : "";
      const bat1 = formatBatsmanLine(live.batsman_1, "Bat 1");
      const bat2 = formatBatsmanLine(live.batsman_2, "Bat 2");
      const batters = (bat1 || bat2)
        ? `<div class="relay-board-batters">${bat1}${bat2}</div>`
        : "";

      let chaseHtml = "";
      if (live.target != null) {
        const need = live.runs_required != null ? ` · Need ${text(String(live.runs_required))}` : "";
        chaseHtml =
          `<div class="relay-widget-chase" role="status">` +
          `Target <strong>${text(String(live.target))}</strong>${need}` +
          `</div>`;
      } else {
        chaseHtml = relayChaseHtml(snap.innings_1, snap.innings_2, snap.innings_2?.score);
      }

      let inns1Line = "";
      const i1 = snap.innings_1;
      if (i1 && i1.score && live.innings_phase === 2) {
        inns1Line = `<div class="relay-board-inns1">${text(i1.team)} ${text(i1.score)}</div>`;
      }

      return (
        resultRow +
        `<div class="relay-widget">` +
          relayStaleLine(b.stale) +
          relayMatchResultLine(snap) +
          `<div class="relay-board-main">` +
            `<div class="relay-board-team">${team}</div>` +
            `<div class="relay-board-total">${total}</div>` +
            `<div class="relay-board-meta">${overs}</div>` +
            batters +
            inns1Line +
          `</div>` +
          chaseHtml +
          errNote +
        `</div>`
      );
    }

    function renderRelayScore(data, resultRow) {
      const b = data.relay_bundle || {};
      const snap = b.snapshot || {};
      const board = renderRelayScoreboard(data, resultRow);
      if (board) return board;
      const errNote = b.last_error
        ? `<div class="relay-widget-wait" style="color:#fca5a5;">${text(b.last_error)}</div>`
        : "";
      if (!relayHasScores(snap)) {
        const ft = text(snap.fixture_title || "");
        const teams = ft !== "—" ? ft : `${text(snap.innings_1?.team || data.team1)} vs ${text(snap.innings_2?.team || data.team2)}`;
        const startAt = [snap.fixture_date, snap.fixture_start_time].filter((v) => v && String(v).trim()).join(" · ");
        const startMsg = startAt ? `Starts ${startAt}` : "Awaiting innings score";
        return (
          resultRow +
          `<div class="relay-widget">` +
            relayStaleLine(b.stale) +
            `<div class="relay-widget-wait">${shortTeamName(teams, 40)}</div>` +
            `<div class="relay-widget-wait">${startMsg}</div>` +
            errNote +
          `</div>`
        );
      }
      const i1 = snap.innings_1 || {};
      const i2 = snap.innings_2 || {};
      const scoreKey = `${i1.score || ""}|${i2.score || ""}|${snap.status || ""}|${b.stale}`;
      const popClass = scoreKey !== lastRelayKey ? "score-pop" : "";
      lastRelayKey = scoreKey;
      const ft = text(snap.fixture_title || "");
      let t1 = i1.team || data.batting_team || data.team1;
      let t2 = i2.team || data.bowling_team || data.team2;
      if ((!t2 || t2 === "—") && ft !== "—" && ft.toLowerCase().includes(" vs ")) {
        const parts = ft.split(/\s+vs\.?\s+/i);
        if (parts.length >= 2) {
          if (!t1 || t1 === "—") t1 = parts[0].trim();
          t2 = parts[1].trim();
        }
      }
      const s1 = i1.score != null ? text(i1.score) : (i1.runs != null ? `${i1.runs}/${i1.wickets}` : "");
      const s2 = i2.score != null ? text(i2.score) : (i2.runs != null ? `${i2.runs}/${i2.wickets}` : "");
      const o1 = i1.overs_display || i1.overs;
      const o2 = i2.overs_display || i2.overs;
      const chaseHtml = relayChaseHtml(i1, i2, s2);
      const side1 = relayWidgetSide("team1-side", t1, s1 || "—", o1, popClass);
      const side2 = relayWidgetSide("team2-side", t2, s2 || "—", o2, "");
      return (
        resultRow +
        `<div class="relay-widget">` +
          relayStaleLine(b.stale) +
          relayMatchResultLine(snap) +
          `<div class="relay-widget-match">` +
            side1 +
            `<div class="relay-widget-vs">vs</div>` +
            side2 +
          `</div>` +
          chaseHtml +
          errNote +
        `</div>`
      );
    }

    function renderMainScoreBlock(data, resultRow) {
      const b = data.relay_bundle || {};
      if (b.enabled) return renderRelayScore(data, resultRow);
      return renderMainScore(data, resultRow);
    }

    function renderOverlay(data) {
      const rb = data.relay_bundle || {};
      const relayOn = !!rb.enabled;
      document.body.classList.toggle("relay-active", relayOn);
      setTheme(data);
      const content = document.getElementById("content");
      const resultRow = (data.match_complete && data.match_result)
        ? `<div class="row result">${text(data.match_result)}</div>`
        : "";
      if (relayOn) {
        content.innerHTML = renderRelayScore(data, resultRow);
        return;
      }
      maybeFlash(data);
      renderMomentum(data);
      renderPressure(data);
      const panel = "score";
      if (panel === "batting") {
        const rows = (data.batting_squad || []).filter(p => p.status === "batting" || p.status === "out");
        if (!rows.length) { content.innerHTML = resultRow + '<div class="row section-title">BATTING</div><div class="row muted">— —</div>'; return; }
        content.innerHTML = renderMainScoreBlock(data, resultRow) + '<div class="row section-title">BATTING CARD</div>' + rows.map(p =>
          `<div class="row ${p.status === "out" ? "muted" : ""}">${pad(p.name)} ${p.runs} (${p.balls})</div>`
        ).join("");
        return;
      }
      if (panel === "bowling") {
        const rows = (data.bowling_squad || []).filter(p => p.overs > 0 || p.balls > 0);
        if (!rows.length) { content.innerHTML = resultRow + '<div class="row section-title">BOWLING</div><div class="row muted">— —</div>'; return; }
        content.innerHTML = renderMainScoreBlock(data, resultRow) + '<div class="row section-title">BOWLING CARD</div>' + rows.map(p =>
          `<div class="row ${p.name === data.current_bowler ? "" : "muted"}">${pad(p.name)} ${p.overs}.${p.balls}-${p.maidens || 0}-${p.runs}-${p.wickets}</div>`
        ).join("");
        return;
      }
      if (panel === "chase") {
        if (data.innings !== 2) { content.innerHTML = resultRow + '<div class="row muted">— 2nd innings only —</div>'; return; }
        content.innerHTML =
          renderMainScoreBlock(data, resultRow) +
          `<div class="statline"><span class="pill">${text(data.batting_team)} need ${text(data.runs_needed)} runs</span><span class="pill">from ${text(data.balls_remaining)} balls</span><span class="pill">RRR ${text(data.rrr)}</span></div>`;
        return;
      }
      if (panel === "fullscore") {
        const batters = (data.batting_squad || []).filter(p => p.status === "batting" || p.status === "out");
        const bowlers = (data.bowling_squad || []).filter(p => p.overs > 0 || p.balls > 0 || p.name === data.current_bowler);
        const batterRows = batters.length
          ? batters.map(p => `<div class="row ${p.status === "out" ? "muted" : ""}">${pad(p.name)} ${p.runs} (${p.balls})</div>`).join("")
          : '<div class="row muted">— —</div>';
        const bowlerRows = bowlers.length
          ? bowlers.map(p => `<div class="row ${p.name === data.current_bowler ? "" : "muted"}">${pad(p.name)} ${p.overs}.${p.balls}-${p.maidens || 0}-${p.runs}-${p.wickets}</div>`).join("")
          : '<div class="row muted">— —</div>';
        const chaseLine = data.innings === 2
          ? `T:${text(data.target)} Need ${text(data.runs_needed)} off ${text(data.balls_remaining)}b RRR:${text(data.rrr)}`
          : `CRR: ${text(data.crr)}`;
        content.innerHTML =
          renderMainScoreBlock(data, resultRow) +
          `<div class="row">${chaseLine}</div>` +
          `<div class="row section-title">Batting</div>` + batterRows +
          `<div class="row section-title">Bowling</div>` + bowlerRows;
        return;
      }
      content.innerHTML = renderMainScoreBlock(data, resultRow);
    }

    async function fetchScore() {
      try {
        const res = await fetch(withMatch("/score"));
        if (!res.ok) throw new Error("non-200");
        lastData = await res.json();
        failCount = 0;
        document.getElementById("stale").style.display = "none";
        renderOverlay(lastData);
      } catch (e) {
        failCount += 1;
        if (failCount >= 3) document.getElementById("stale").style.display = "block";
        if (lastData) {
          renderOverlay(lastData);
        } else if (failCount >= 2) {
          document.getElementById("content").innerHTML =
            '<div class="row muted">Cannot reach <code>/score</code> on this host (network, firewall, or server error). Open <code>' +
            withMatch("/score") +
            "</code> in a browser to verify.</div>";
        }
      }
    }

    fetchScore();
    setInterval(fetchScore, {{ poll_interval_ms | default(2000) }});
  </script>
</body>
</html>
